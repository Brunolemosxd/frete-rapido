plugins { id 'com.android.application' }
android {
    namespace 'io.github.brunolemosxd.muralfretes'
    compileSdk 34
    defaultConfig {
        applicationId 'io.github.brunolemosxd.muralfretes'
        minSdk 21
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }
    signingConfigs {
        release {
            storeFile file(System.getenv('MF_KEYSTORE') ?: 'naoexiste.jks')
            storePassword System.getenv('MF_KEYPASS') ?: ''
            keyAlias 'mural'
            keyPassword System.getenv('MF_KEYPASS') ?: ''
        }
    }
    buildTypes { release { minifyEnabled false; signingConfig signingConfigs.release } }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
dependencies { implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.5.0' }
