<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de dias no topo, cartões de entrega por turno, botão grande de nova entrega embaixo */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d5dce3;
  --accent:#1f5fae; --accent-fg:#ffffff;
  --pend:#b7791f; --pend-bg:#fdf3e1; --ok:#2f855a; --ok-bg:#e3f4ea; --bad:#c53030; --bad-bg:#fbe7e7;
  --shadow:0 1px 2px rgba(23,33,43,.08),0 4px 14px rgba(23,33,43,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --fg:#e7edf2; --muted:#97a6b3; --line:#2a3642;
  --accent:#5b9bec; --accent-fg:#0b1520;
  --pend:#f0b450; --pend-bg:#33270f; --ok:#5fcf8f; --ok-bg:#12301f; --bad:#f07171; --bad-bg:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --fg:#e7edf2; --muted:#97a6b3; --line:#2a3642;
  --accent:#5b9bec; --accent-fg:#0b1520;
  --pend:#f0b450; --pend-bg:#33270f; --ok:#5fcf8f; --ok-bg:#12301f; --bad:#f07171; --bad-bg:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sync{font-size:13px;color:var(--muted)}
.sync.on{font-size:17px;font-weight:700;color:var(--ok);display:inline-flex;align-items:center;gap:6px}
.sync.on::before{content:"";width:10px;height:10px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.sync.off{font-weight:600;color:var(--bad)}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:8px 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 8px 8px;text-align:center;display:grid;gap:1px}
.day .wd{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.day .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:15px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day.on .wd,.day.on .ct{color:var(--accent-fg);opacity:.9}
.day .ct b{color:var(--pend)} .day.on .ct b{color:inherit}
main{padding-block:14px 120px;display:grid;gap:18px;max-width:720px;margin:0 auto}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:22px;margin:0;text-transform:capitalize}
.tally{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pill{border-radius:99px;padding:2px 9px;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.p-pend{background:var(--pend-bg);color:var(--pend)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
section.late h3{color:var(--bad)}
section.feitas h3{color:var(--ok)}
section.feitas{border-top:1px solid var(--line);padding-top:14px}
.list{display:grid;gap:10px}
.card{position:relative;border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:600;font-size:14px}
.under .l{color:var(--ok)} .under .r{color:var(--bad)}
.face{position:relative;background:var(--surface);box-shadow:var(--shadow);border-left:5px solid var(--pend);padding:12px 12px 12px 12px;display:flex;gap:12px;transition:transform .2s ease}
.card.prio .face{background:#c53030;color:#fff;border-left-color:#7a1414;box-shadow:0 4px 14px rgba(197,48,48,.35)}
.card.prio .face .who span,.card.prio .items,.card.prio .meta{color:#fff!important}
.card.prio .tag{border-color:rgba(255,255,255,.6);color:#fff}
.card.prio .thumb{border-color:rgba(255,255,255,.5)}
.pprio{background:#fff;color:#c53030;font-weight:700}
section.prio h3{color:var(--bad);font-size:14px}
.chip.prio[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.card.st-entregue .face{border-left-color:var(--ok)} .card.st-problema .face{border-left-color:var(--bad)}
.card.st-entregue .face .who{text-decoration:line-through;opacity:.65}
.thumb{flex:0 0 64px;height:64px;border-radius:10px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px}
.info{min-width:0;flex:1;display:grid;gap:4px}
.who{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--fg)}
.tag.dep{border-color:var(--accent);color:var(--accent)}
.items{font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.obs{font-size:13px;color:var(--bad)}
textarea{resize:vertical;min-height:80px}
/* post-it: amarelo nos dois temas, como papel de verdade */
.postits{display:grid;gap:8px;margin-top:4px}
.postit{background:#fff3a6;color:#3d3500;border-radius:3px;padding:8px 10px;font-size:14px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.14);transform:rotate(-.6deg);white-space:pre-wrap;overflow-wrap:anywhere}
.postit:nth-child(even){transform:rotate(.6deg)}
.postit .pm{font-size:11px;opacity:.7;margin-top:4px}
.postit.full{display:flex;gap:8px;align-items:flex-start;transform:none}
.postit.full .tx{flex:1;min-width:0}
.postit.full button{border:0;background:rgba(61,53,0,.12);color:#3d3500;border-radius:99px;width:28px;height:28px;flex:0 0 auto;font-size:16px;line-height:1}
textarea.postit-in{background:#fff3a6;color:#3d3500;border-color:#e6d36a}
.btn.post{background:#fff3a6;border-color:#e6d36a;color:#3d3500}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:6px}
.empty strong{color:var(--fg);font-size:17px}
.hint{font-size:13px;color:var(--muted);text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:15px 26px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 20px rgba(31,95,174,.35)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase}
.field{display:grid;gap:7px}
.field>label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=text],input[type=date],input[type=time],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.req{color:var(--bad)}
input.err{border-color:var(--bad)}
.chips.err .chip{border-color:var(--bad)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.toggles .chip{text-align:left;font-size:14px;padding:10px 12px;line-height:1.25}
.prods{display:flex;gap:6px;flex-wrap:wrap}
.prod{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--bg)}
.pitem .linha{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.qty b{font-family:var(--display);font-size:22px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.pitem .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;flex:0 0 auto;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 10px;font-weight:600;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.pitem.err .seg{border-color:var(--bad)}
.pitem .x{flex:0 0 auto;border:0;background:var(--line);border-radius:99px;width:28px;height:28px;line-height:1;font-size:16px}
.fonerow{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn.sm{padding:8px 12px;font-size:15px}
.extra{position:relative}
.photo-x{position:absolute;top:8px;right:8px;border:0;background:var(--bad);color:#fff;border-radius:99px;width:32px;height:32px;line-height:1;font-size:16px;box-shadow:0 0 0 2px #fff}
.pasta{justify-self:start;display:inline-flex;align-items:center;gap:6px;border:1.5px solid var(--bad);border-radius:99px;padding:6px 12px;background:var(--surface);color:var(--bad);font-weight:600;font-size:14px}
.pasta .n{background:var(--bad);color:#fff;border-radius:99px;min-width:22px;height:22px;display:grid;place-items:center;font-size:12px;font-weight:700;padding:0 6px}
.plist2{display:grid;gap:14px}
.pfoto{display:grid;gap:4px}
.pfoto .pm{font-size:13px;color:var(--muted)}
.btn.junto{background:var(--bad);border-color:var(--bad);color:#fff;font-size:17px;padding:15px 16px}
.p-frete{background:var(--bg);color:var(--fg);border:1px solid var(--line)}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:600;font-size:16px;background:var(--bg);border:1.5px solid var(--line)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.btn.bad{background:var(--bad);border-color:var(--bad);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--bad);background:transparent;border-color:var(--bad)}
.btn:disabled{opacity:.5}
.actions{display:grid;gap:10px}
.actions.two{grid-template-columns:1fr 1fr}
.photo{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}
.photo img{display:block;width:100%;max-height:60vh;object-fit:contain}
.photobtn{display:flex;gap:10px;align-items:center}
.fextras{display:flex;gap:10px;flex-wrap:wrap}
.fextras:empty{display:none}
.fx{position:relative}
.fx .thumb{width:64px;height:64px}
.fx button{position:absolute;top:-6px;right:-6px;border:0;background:var(--bad);color:#fff;border-radius:99px;width:24px;height:24px;line-height:1;font-size:14px;box-shadow:0 0 0 2px var(--surface)}
.thumb{position:relative}
.tcol{flex:0 0 64px;display:grid;gap:4px;align-content:start;justify-items:center}
.tcol .thumb{width:64px}
.carr{font-size:12px;font-weight:700;color:var(--accent);text-align:center;line-height:1.2;overflow-wrap:anywhere}
.card.prio .carr{color:#fff}
.thumb .mais{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700}
.crow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}
.crow input{min-width:0}
.crow button{border:0;background:var(--line);border-radius:99px;width:30px;height:30px;font-size:16px;line-height:1}
.addbtn{justify-self:start;padding:8px 12px;font-size:15px}
.notas2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notas2.err .cont{border-color:var(--bad)}
.cont{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;display:grid;gap:6px;justify-items:center}
.cont>span{font-weight:600;font-size:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.step b{font-family:var(--display);font-size:26px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.photobtn .thumb{flex-basis:72px;height:72px}
.det{display:grid;gap:6px;font-size:15px}
.det ul{margin:0;padding-left:20px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
.usr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-bottom:2px}
.usr a,.usr button{color:var(--accent);font-weight:600;background:none;border:0;padding:4px 0;font-size:13px;text-decoration:none}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 20px;display:grid;gap:16px;text-align:center}
.login h1{font-size:34px}
.login p{margin:0;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);background:#fff;color:#1f1f1f;border-radius:12px;padding:13px 16px;font-weight:600;font-size:16px}
.gbtn svg{width:20px;height:20px}
</style>
</head>

<script>

const $=s=>document.querySelector(s);

// quem carrega o caminhão (aparece no menu ao segurar o cartão)

const MOTIVOS_BASE=typeof MOTIVOS_PADRAO!=='undefined'?MOTIVOS_PADRAO:['Cliente ausente','Endereço errado','Produto faltando','Produto avariado','Não coube no carro','Remarcar'];
let MOTIVOS=[...MOTIVOS_BASE];

let entregas=[],loaded=false,dia=ds(new Date());

function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
const hoje=()=>ds(new Date());
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nomeDia(s){const h=hoje();if(s===h)return 'Hoje';if(s===addDays(h,1))return 'Amanhã';if(s===addDays(h,-1))return 'Ontem';
  return pd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,t.length>60?4500:2600)}
function fotoSrc(e){return e.thumb||e.fotoData||''}
const podeEditar=e=>P.editarTodas||(P.lancar&&e.criadoPorUid===me.uid);
function turnoTxt(e){return e.turno==='apos'?'Depois das '+(e.hora||'—'):(TURNOS[e.turno]||'Qualquer turno')}
function ordemTurno(e){return {manha:0,tarde:1,apos:2}[e.turno]??3}
const PRODUTOS=['Geladeira','Freezer','Fogão','Cooktop','Forno elétrico','Micro-ondas','Coifa','Lava-louças','Máquina de lavar','Lava e seca','Tanquinho','Secadora','Ar-condicionado','TV','Colchão','Cama box','Sofá','Guarda-roupa','Cômoda','Armário de cozinha','Mesa e cadeiras','Rack / painel'];
const LOC={loja:'Loja',deposito:'Depósito'};
// entregas antigas guardavam itens como texto e um único local para tudo
function itensDe(e){return (e.itens||[]).map(i=>typeof i==='string'?{nome:i,local:e.local||'loja',qtd:1}:{nome:i.nome||'',local:i.local||null,qtd:Math.max(1,+i.qtd||1)})}
const qtdNome=i=>(i.qtd>1?i.qtd+'× ':'')+i.nome;
function locais(e){const its=itensDe(e),s=new Set(its.map(i=>i.local).filter(Boolean));if(!its.length)s.add(e.local==='deposito'?'deposito':'loja');
  return {txt:s.size>1?'Loja + Depósito':s.has('deposito')?'Depósito':'Loja',dep:s.has('deposito')}}
// quantas notas fiscais e onde estão; entregas antigas só tinham "mais de uma nota"
function notasTxt(e){const l=+e.notasLoja||0,d=+e.notasDeposito||0;if(!l&&!d)return '';
  const p=(n,t)=>n?`${n} ${n===1?'nota':'notas'} ${t}`:'';return [p(l,'na loja'),p(d,'no depósito')].filter(Boolean).join(' · ')}
function notasTagHTML(e){const t=notasTxt(e);if(t)return `<span class="pill ${(+e.notasLoja||0)+(+e.notasDeposito||0)>1?'p-bad':'p-frete'}">📄 ${esc(t)}</span>`;
  return e.variasNotas?'<span class="pill p-bad">📎 Mais de uma nota</span>':''}
function localTagHTML(e){const l=locais(e);return `<span class="tag ${l.dep?'dep':''}">${l.txt}</span>`}
function soDig(v){return String(v||'').replace(/\D/g,'')}
function fmtFone(v){const d=soDig(v).slice(0,11);if(!d)return '';if(d.length<3)return '('+d;
  const a=d.slice(0,2),r=d.slice(2);if(r.length<=4)return `(${a}) ${r}`;const k=r.length>8?5:4;return `(${a}) ${r.slice(0,k)}-${r.slice(k)}`}
function foneOk(v){const n=soDig(v).length;return n===10||n===11}
function quando(t){return t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
async function copiar(t){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch{}
  // alguns navegadores bloqueiam a área de transferência dentro de páginas incorporadas
  if(!ok){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch{}ta.remove()}
  toast(ok?'Número copiado. É só colar no WhatsApp.':'Não consegui copiar. Segure o dedo no número para copiar.')}
function pegarFoto(cb){const f=$('#file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
  let b;try{b=await reduzir(file,1600,.8)}catch{toast('Não consegui ler essa foto.');return}cb(b)};f.click()}
function aMaisTxt(e){return e.aMaisPor?e.aMaisPor+' pôs '+(e.aMaisValor?'+'+real(e.aMaisValor):'a mais'):''}
function real(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}

/* ---------- dias ---------- */
function renderDays(){
  const h=hoje(),box=$('#days');let html='';
  for(let i=-2;i<=12;i++){
    const s=addDays(h,i),d=pd(s),list=entregas.filter(e=>e.data===s);
    const pend=list.filter(e=>e.status==='pendente').length;
    html+=`<button type="button" role="tab" class="day${s===dia?' on':''}" data-d="${s}" aria-selected="${s===dia}">
      <span class="wd">${i===0?'hoje':WD[d.getDay()]}</span><span class="dn">${d.getDate()}</span>
      <span class="ct">${list.length?(pend?`<b>${pend}</b>/${list.length}`:'✓ '+list.length):''}</span></button>`;
  }
  box.innerHTML=html;
  const on=box.querySelector('.on');if(on&&!renderDays.did){on.scrollIntoView({inline:'center',block:'nearest'});renderDays.did=true}
}
$('#days').addEventListener('click',e=>{const b=e.target.closest('.day');if(!b)return;dia=b.dataset.d;render()});

/* ---------- lista ---------- */
function cardHTML(e){
  const src=fotoSrc(e),nm=e.criadoPorNome,V=P.verValores;
  const itens=itensDe(e).map(i=>qtdNome(i)+(i.local?` (${LOC[i.local]})`:'')).join(' · ');
  const pr=e.prioridade&&e.status!=='entregue';
  return `<div class="card st-${e.status}${pr?' prio':''}" data-id="${esc(e.id)}">
    <div class="under"><span class="l">✓ Entregue</span><span class="r">Problema ✕</span></div>
    <div class="face">
      <div class="tcol"><div class="thumb" ${src?`style="background-image:url('${esc(src)}')"`:''}>${src?'':'sem foto'}${e.fotosExtras?`<span class="mais">+${e.fotosExtras}</span>`:''}</div>${carr(e)?`<span class="carr">🚚 ${esc(carr(e))}</span>`:''}</div>
      <div class="info">
        ${pr?'<div><span class="pill pprio">⬆ Prioridade</span></div>':''}
        <div class="who">${esc(e.cliente||'Sem nome')}${e.bairro?` <span style="font-weight:400;color:var(--muted)">· ${esc(e.bairro)}</span>`:''}</div>
        <div class="meta"><span class="tag">${esc(turnoTxt(e))}</span>${localTagHTML(e)}${V&&e.frete?`<span class="tag">${real(e.frete)}${e.fretePor?' · por conta: '+esc(e.fretePor):''}</span>`:''}${V&&e.aMaisPor?`<span class="tag">${esc(aMaisTxt(e))}</span>`:''}${notasTagHTML(e)}${e.fretePago?'<span class="pill p-ok">✓ Frete pago</span>':''}<span class="pill ${ST[e.status][1]}">${ST[e.status][0]}</span></div>
        ${itens?`<div class="items">${esc(itens)}</div>`:''}
        ${e.observacao?`<div class="items">Obs.: ${esc(e.observacao)}</div>`:''}
        ${e.status==='problema'&&e.obs?`<div class="obs">${esc(e.obs)}</div>`:''}
        ${(e.postits||[]).length?`<div class="postits">${e.postits.map(p=>`<div class="postit">${esc(p.texto)}</div>`).join('')}</div>`:''}
        ${nm?`<div class="meta">por ${esc(nm)}</div>`:''}
      </div>
    </div></div>`;
}
function render(){
  renderDays();ouvirNotas();
  const m=$('#main');
  const list=entregas.filter(e=>e.data===dia).sort((a,b)=>ordemTurno(a)-ordemTurno(b)||(a.hora||'').localeCompare(b.hora||'')||(a.criadoEm||0)-(b.criadoEm||0));
  const atras=dia===hoje()?entregas.filter(e=>e.data<dia&&e.status==='pendente').sort((a,b)=>a.data.localeCompare(b.data)):[];
  const c=k=>list.filter(e=>e.status===k).length;
  const totFrete=list.filter(e=>e.status!=='problema').reduce((s,e)=>s+(Number(e.frete)||0),0);
  let html=`<div class="dayhead"><h2>${esc(nomeDia(dia))}</h2><div class="tally">
    ${list.length?`<span class="pill p-pend">${c('pendente')} pendente${c('pendente')===1?'':'s'}</span><span class="pill p-ok">${c('entregue')} entregue${c('entregue')===1?'':'s'}</span>${c('problema')?`<span class="pill p-bad">${c('problema')} problema</span>`:''}${P.verValores&&totFrete?`<span class="pill p-frete">Fretes ${real(totFrete)}</span>`:''}`:''}
  </div></div>`;
  const nj=notasDoDia(dia).length;
  html+=`<button type="button" class="pasta" id="pasta"><span aria-hidden="true">📁</span>Produtos que vão com outras notas${nj?`<span class="n">${nj}</span>`:''}</button>`;
  if(atras.length) html+=`<section class="late"><h3>Ficaram para trás (${atras.length})</h3><div class="list">${atras.map(cardHTML).join('')}</div></section>`;
  if(!loaded){html+=`<div class="empty"><strong>Carregando o mural…</strong><span>As entregas agendadas aparecem aqui.</span></div>`}
  else if(!list.length){html+=`<div class="empty"><strong>Nenhuma entrega para ${esc(nomeDia(dia).toLowerCase())}</strong>${P.lancar?'<span>Toque em <b>+ Nova entrega</b> para lançar a nota.</span>':''}</div>`}
  else{
    // as já entregues saem dos turnos e vão para o fim da tela
    const abertas=list.filter(e=>e.status!=='entregue'),feitas=list.filter(e=>e.status==='entregue');
    const prio=abertas.filter(e=>e.prioridade);
    if(prio.length)html+=`<section class="prio"><h3>⬆ Prioridade (${prio.length})</h3><div class="list">${prio.map(cardHTML).join('')}</div></section>`;
    for(const t of ['manha','tarde','apos','']){
      const g=abertas.filter(e=>!e.prioridade).filter(e=>(e.turno||'')===t||(t===''&&!TURNOS[e.turno]));
      if(!g.length)continue;
      html+=`<section><h3>${t==='apos'?'Depois de horário':t?TURNOS[t]:'Qualquer turno'}</h3><div class="list">${g.map(cardHTML).join('')}</div></section>`;
    }
    if(!abertas.length)html+=`<div class="empty"><strong>Tudo entregue! 🎉</strong></div>`;
    if(feitas.length)html+=`<section class="feitas"><h3>Entregues (${feitas.length})</h3><div class="list">${feitas.map(cardHTML).join('')}</div></section>`;
    html+=`<p class="hint">${P.marcar?'Arraste para a direita: entregue · para a esquerda: problema · segure para mais opções':'Toque numa entrega para ver tudo'}</p>`;
  }
  m.innerHTML=html;
}

/* ---------- pasta de notas que vão juntas ---------- */
function ouvirNotas(){
  if(!me||notasDe===dia)return;notasDe=dia;pararNotas&&pararNotas();notasJ=[];
  pararNotas=db.collection('notasjuntas').where('data','==',dia).onSnapshot(snap=>{
    notasJ=snap.docs.map(d=>({id:d.id,...d.data()}));
    if(pastaAberta){const l=$('#plista');if(l&&!l.contains(document.activeElement))l.innerHTML=listaPastaHTML()}else if(!document.querySelector('.scrim'))render();
  },()=>{});
}
function notasDoDia(d){return notasJ.filter(n=>n.data===d).sort((a,b)=>(b.em||0)-(a.em||0))}
$('#main').addEventListener('click',e=>{if(e.target.closest('#pasta'))abrirPasta()});
function listaPastaHTML(){
  const l=notasDoDia(dia);
  if(!l.length)return `<div class="empty"><strong>Nenhuma foto ainda</strong><span>${P.pasta?'Quando um produto for junto com outra nota, tire a foto dessa nota aqui.':'As fotos das notas que vão juntas aparecem aqui.'}</span></div>`;
  return l.map(n=>`<div class="pfoto"><div class="photo extra"><img src="${esc(fotoSrc(n))}" alt="Foto da nota">${P.pasta?`<button type="button" class="photo-x" data-del="${esc(n.id)}" aria-label="Tirar esta foto">×</button>`:''}</div>
    ${P.pasta?`<input type="text" data-txt="${esc(n.id)}" value="${esc(n.texto||'')}" autocomplete="off" enterkeyhint="done" placeholder="Escreva um detalhe desta foto (opcional)" aria-label="Detalhe desta foto">`:(n.texto?`<div>${esc(n.texto)}</div>`:'')}
    <div class="pm">${esc([quando(n.em),n.porNome].filter(Boolean).join(' · '))}</div></div>`).join('');
}
function abrirPasta(){
  abrirSheet(`<h2>📁 Produtos que vão com outras notas</h2><p style="margin:0;color:var(--muted)">${esc(nomeDia(dia))}</p>
    ${P.pasta?'<button type="button" class="btn junto" data-a="foto">📷 Tirar foto da nota</button>':''}
    <div class="plist2" id="plista">${listaPastaHTML()}</div>
    <button type="button" class="btn ghost" data-x>Fechar</button>`,
  s=>{pastaAberta=true;s.addEventListener('click',ev=>{
    if(ev.target.closest('[data-x]'))fechar();
    if(ev.target.closest('[data-a="foto"]')){
      const d=dia;pegarFoto(async b=>{
        toast('Enviando a foto…');
        try{const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          await db.collection('notasjuntas').doc(id).set({data:d,texto:'',fotoData:await fotoGrande(b),em:Date.now(),porUid:me.uid,porNome:me.nome});
          toast('Foto guardada. Se quiser, escreva um detalhe embaixo dela.')}
        catch(e){e?.code==='permission-denied'?semPermissao():e?.code==='resource-exhausted'?toast('O mural está cheio por hoje. Fale com o Bruno.'):toast('Não consegui guardar a foto. Tente de novo.')}
      })}
    const del=ev.target.closest('[data-del]');if(del)confirmarTirarFoto(del.dataset.del);
  });
  // o detalhe de cada foto é salvo quando a pessoa sai do campo
  s.addEventListener('change',async ev=>{const t=ev.target.closest('[data-txt]');if(!t)return;
    const id=t.dataset.txt,v=t.value.trim(),n=notasJ.find(x=>x.id===id);if(!n||(n.texto||'')===v)return;n.texto=v;
    try{await db.collection('notasjuntas').doc(id).update({texto:v});toast('Detalhe salvo')}
    catch(e){e?.code==='permission-denied'?semPermissao():toast('Não consegui salvar o detalhe.')}});
  s.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.closest('[data-txt]'))ev.target.blur()});
  });
}
function confirmarTirarFoto(id){
  abrirSheet(`<h2>Tirar esta foto da pasta?</h2><p style="margin:0;color:var(--muted)">Ela some para todos.</p>
    <div class="actions two"><button type="button" class="btn ghost" data-x>Cancelar</button><button type="button" class="btn bad" data-ok>Tirar</button></div>`,
  s=>s.addEventListener('click',async ev=>{
    if(ev.target.closest('[data-x]'))abrirPasta();
    if(ev.target.closest('[data-ok]')){try{await db.collection('notasjuntas').doc(id).delete();toast('Foto tirada')}catch(e){e?.code==='permission-denied'?semPermissao():toast('Não consegui tirar.')}abrirPasta()}
  }));
}

/* ---------- gestos ---------- */
let g=null;
$('#main').addEventListener('pointerdown',ev=>{
  const card=ev.target.closest('.card');if(!card)return;
  g={card,id:card.dataset.id,x:ev.clientX,y:ev.clientY,dx:0,moved:false,long:false,face:card.querySelector('.face')};
  g.timer=setTimeout(()=>{if(g&&!g.moved){g.long=true;navigator.vibrate?.(30);abrirAcoes(g.id)}},480);
});
window.addEventListener('pointermove',ev=>{
  if(!g)return;const dx=ev.clientX-g.x,dy=ev.clientY-g.y;
  if(!g.moved&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){clearTimeout(g.timer);g=null;return}
  if(Math.abs(dx)>8){g.moved=true;clearTimeout(g.timer)}
  if(g.moved&&P.marcar){g.dx=dx;g.face.style.transition='none';g.face.style.transform=`translateX(${dx}px)`}
});
function endG(){
  if(!g)return;clearTimeout(g.timer);const {dx,face,id,moved,long}=g;g=null;
  face.style.transition='';face.style.transform='';
  if(long)return;
  if(moved){if(!P.marcar)return;if(dx>90)setStatus(id,'entregue');else if(dx<-90)abrirProblema(id)}
  else abrirDetalhe(id);
}
window.addEventListener('pointerup',endG);
window.addEventListener('pointercancel',()=>{if(g){clearTimeout(g.timer);g.face.style.transform='';g=null}});
$('#main').addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});

/* ---------- gravações ---------- */
function semPermissao(){toast('Você não tem permissão para isso. Fale com o Bruno.')}
async function salvar(id,dados,novo){
  try{const ref=db.collection('entregas').doc(id);novo?await ref.set(dados):await ref.update(dados);return true}
  catch(e){if(e?.code==='permission-denied')semPermissao();
    else if(e?.code==='resource-exhausted')toast('O mural está cheio por hoje. Fale com o Bruno.');
    else toast('Não consegui salvar. Tente de novo.');return false}
}
async function setStatus(id,status,obs){
  const e=entregas.find(x=>x.id===id);if(!e)return;
  const d={status,atualizadoEm:Date.now()};if(obs!==undefined)d.obs=obs;
  Object.assign(e,d);render();
  if(await salvar(id,d)) toast(status==='entregue'?'Marcada como entregue':status==='problema'?'Marcada com problema':'Voltou para pendente');
}

/* ---------- sheets ---------- */
function abrirSheet(html,onMount){
  pastaAberta=false;const r=$('#sheetRoot');r.innerHTML=`<div class="scrim"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  const scrim=r.firstChild;scrim.addEventListener('click',e=>{if(e.target===scrim)fechar()});
  onMount&&onMount(scrim.firstChild);
}
function fechar(){pastaAberta=false;$('#sheetRoot').innerHTML='';render()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')fechar()});

function abrirAcoes(id){
  const e=entregas.find(x=>x.id===id);if(!e)return;
  abrirSheet(`<h2>${esc(e.cliente||'Entrega')}</h2>
    ${P.marcar||podeEditar(e)?`<div class="field"><span class="lbl">Quem carregou</span><div class="chips">${CARREGADORES.map(n=>`<button type="button" class="chip" data-carr="${esc(n)}" aria-pressed="${carr(e)===n}">🚚 ${esc(n)}</button>`).join('')}</div></div>`:''}
    ${P.marcar?'<div class="actions two"><button class="btn ok" data-a="entregue">✓ Entregue</button><button class="btn bad" data-a="problema">✕ Problema</button></div>':''}
    <div class="actions">${P.marcar&&e.status!=='pendente'?'<button class="btn" data-a="pendente">Voltar para pendente</button>':''}
    <button class="btn post" data-a="postit">📝 Colar post-it</button>
    ${podeEditar(e)?`<button class="btn ${e.prioridade?'':'bad'}" data-a="prio">${e.prioridade?'Tirar a prioridade':'⬆ Marcar como prioridade'}</button>`:''}
    ${P.marcar?'<button class="btn" data-a="amanha">Passar para o dia seguinte</button>':''}
    ${podeEditar(e)?'<button class="btn" data-a="editar">Editar</button>':''}<button class="btn" data-a="ver">Ver nota e foto</button>
    ${P.apagar?'<button class="btn danger" data-a="apagar">Apagar</button>':''}<button class="btn ghost" data-a="x">Fechar</button></div>`,
  s=>s.addEventListener('click',async ev=>{
    const cb=ev.target.closest('[data-carr]');
    if(cb){const v=carr(e)===cb.dataset.carr?'':cb.dataset.carr;fechar();e.carregadoPor=v;render();
      if(await salvar(id,{carregadoPor:v,carregadoEm:Date.now(),atualizadoEm:Date.now()}))toast(v?'Carregada por '+v:'Tirado quem carregou');return}
    const a=ev.target.closest('[data-a]')?.dataset.a;if(!a)return;
    if(a==='entregue'||a==='pendente'){fechar();setStatus(id,a)}
    else if(a==='problema')abrirProblema(id);
    else if(a==='amanha'){fechar();const nd=addDays(e.data<hoje()?hoje():e.data,1);e.data=nd;render();if(await salvar(id,{data:nd,atualizadoEm:Date.now()}))toast('Passada para '+nomeDia(nd).toLowerCase())}
    else if(a==='postit')abrirPostit(id);
    else if(a==='prio'){fechar();const v=!e.prioridade;e.prioridade=v;render();if(await salvar(id,{prioridade:v,atualizadoEm:Date.now()}))toast(v?'Marcada como prioridade':'Prioridade tirada')}
    else if(a==='editar')abrirForm(e);
    else if(a==='ver')abrirDetalhe(id);
    else if(a==='apagar')confirmarApagar(id);
    else fechar();
  }));
}
function abrirProblema(id){
  const e=entregas.find(x=>x.id===id);if(!e)return;
  abrirSheet(`<h2>O que aconteceu?</h2><div class="chips">${MOTIVOS.map(m=>`<button class="chip" data-m="${esc(m)}">${esc(m)}</button>`).join('')}</div>
    <div class="field"><label for="pobs">Outro motivo</label><input type="text" id="pobs" placeholder="Opcional" maxlength="60">
      ${me.admin?'<button type="button" class="btn addbtn" data-cad>+ Cadastrar como motivo novo</button>':''}</div>
    <div class="actions two"><button class="btn ghost" data-x>Cancelar</button><button class="btn bad" data-ok>Marcar problema</button></div>`,
  s=>s.addEventListener('click',async ev=>{
    if(ev.target.closest('[data-cad]')){const v=s.querySelector('#pobs').value.trim().replace(/\s+/g,' ');
      if(!v){toast('Escreva o motivo no campo "Outro motivo".');s.querySelector('#pobs').focus();return}
      if(MOTIVOS.some(x=>x.toLowerCase()===v.toLowerCase())){toast('Esse motivo já está na lista.');return}

      const d=e.target.closest('[data-del]');if(d){st.itens.splice(+d.dataset.del,1);sync()}});
    q('#fbtn').addEventListener('click',()=>{const f=$('#file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
      try{fotoBlob=await reduzir(file,1400,.75);if(fotoPrev&&fotoPrev.startsWith('blob:'))URL.revokeObjectURL(fotoPrev);fotoPrev=URL.createObjectURL(fotoBlob);sync()}catch{toast('Não consegui ler essa foto.')}};f.click()});
    q('#fcancel').addEventListener('click',fechar);
    q('#fsave').addEventListener('click',async()=>{
      if(enviando)return;
      st.clienteNome=q('#fcli').value.trim().replace(/\s+/g,' ');st.clienteSobrenome=q('#fsob').value.trim().replace(/\s+/g,' ');st.cliente=(st.clienteNome+' '+st.clienteSobrenome).trim();st.bairro=q('#fbai').value.trim();st.endereco=q('#fend').value.trim();st.observacao=q('#fobs').value.trim();st.fone=q('#fone').value.trim();st.hora=q('#fhora').value;
      const pendItem=q('#fitem').value.trim();if(pendItem){st.itens.push({nome:pendItem,local:null,qtd:1});q('#fitem').value='';sync()}
      const erros=[['#fcli',!st.clienteNome,'Coloque o nome do cliente como está na nota.'],['#fsob',!st.clienteSobrenome,'Coloque o sobrenome do cliente como está na nota.'],['#fone',!foneOk(st.fone),'Coloque o telefone com DDD. Ex.: (11) 98765-4321'],
        ['#fbai',!st.bairro,'Coloque o bairro.'],['#fend',!st.endereco,'Coloque o endereço.'],['#ffrete',!(st.frete>0),'Coloque o valor do frete.']].filter(x=>x[1]);
      erros.forEach(([sel])=>q(sel).classList.add('err'));
      if(erros.length){toast(erros[0][2]);q(erros[0][0]).focus();return}
      // mesmo telefone no mesmo dia = entrega duplicada
      const dup=entregas.find(x=>x.id!==(ed?ed.id:'')&&x.data===st.data&&soDig(x.fone)===soDig(st.fone));
      if(dup){q('#fone').classList.add('err');q('#fone').focus();toast(`Já existe uma entrega para ${nomeDia(st.data).toLowerCase()} com esse telefone (${dup.cliente||'sem nome'}). Não lance de novo.`);return}
      const contOk=contatos.map(c=>({nome:c.nome.trim(),fone:c.fone.trim()})).filter(c=>c.nome||c.fone);
      const ruim=contatos.findIndex(c=>(c.nome.trim()||c.fone.trim())&&!foneOk(c.fone));
      if(ruim>=0){const el=q(`[data-cf="${ruim}"]`);el.classList.add('err');el.focus();toast('Confira o telefone do outro contato, com DDD.');return}
      if(carregandoExtras){toast('Espere as fotos carregarem.');return}
      if(st.porConta&&!st.fretePor){q('#cvend').classList.add('err');toast('Escolha quem paga o frete.');q('#cvend').scrollIntoView({block:'center'});return}
      if(st.aMais&&!st.aMaisPor){q('#cmaisv').classList.add('err');toast('Escolha qual vendedor pôs a mais no frete.');q('#cmaisv').scrollIntoView({block:'center'});return}
      if(st.notasLoja+st.notasDeposito<1){q('#fnotas').classList.add('err');toast('Diga quantas notas tem na loja e no depósito.');q('#fnotas').scrollIntoView({block:'center'});return}
      if(st.itens.some(i=>!i.local)){errLocal=true;sync();toast('Diga se cada produto está na loja ou no depósito.');q('#fitens .pitem.err')?.scrollIntoView({block:'center'});return}
      enviando=true;const btn=q('#fsave');btn.disabled=true;btn.textContent='Salvando…';
      try{
        const id=ed?ed.id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        let fotoNova=null;
        if(fotoBlob){st.thumb=await fotoMiniatura(fotoBlob);fotoNova=await fotoGrande(fotoBlob);st.fotoData=null}
        const fotosExtras=[];for(const x of extras)fotosExtras.push(x.blob?await fotoGrande(x.blob):x.src);
        const ls=new Set(st.itens.map(i=>i.local));
        const dados={cliente:st.cliente,clienteNome:st.clienteNome,clienteSobrenome:st.clienteSobrenome,fone:st.fone,bairro:st.bairro,endereco:st.endereco,observacao:st.observacao,frete:st.frete,fretePago:st.fretePago,prioridade:st.prioridade,fretePor:st.porConta?st.fretePor:'',aMaisPor:st.aMais?st.aMaisPor:'',aMaisValor:st.aMais?st.aMaisValor:0,notasLoja:st.notasLoja,notasDeposito:st.notasDeposito,variasNotas:st.notasLoja+st.notasDeposito>1,data:st.data,turno:st.turno,hora:st.turno==='apos'?st.hora:'',
          itens:st.itens.map(i=>({nome:i.nome,local:i.local,qtd:i.qtd})),local:ls.size>1?'ambos':ls.has('deposito')?'deposito':'loja',
          thumb:st.thumb||null,fotoData:st.fotoData||null,contatos:contOk,fotosExtras:fotosExtras.length,atualizadoEm:Date.now()};
        let ok;
        if(ed){ok=await salvar(id,dados)}
        else{dados.status='pendente';dados.obs='';dados.criadoEm=Date.now();dados.criadoPorUid=me.uid;dados.criadoPorNome=me.nome;ok=await salvar(id,dados,true)}
        // as que sobraram de antes ficam vazias (vendedor não pode apagar foto) e somem na limpeza
        if(ok)for(let i=0;i<Math.max(fotosExtras.length,qtdExtrasAntes);i++){
          try{await db.collection('fotos').doc(id+'__'+(i+1)).set({foto:fotosExtras[i]||'',em:Date.now()})}catch{toast('A entrega foi salva, mas uma das fotos não. Tente de novo.');break}}
        if(ok&&fotoNova){try{await db.collection('fotos').doc(id).set({foto:fotoNova,em:Date.now()})}catch{toast('A entrega foi salva, mas a foto grande não. Tente pôr a foto de novo.')}}
        if(ok){fechar();dia=st.data;render();toast(ed?'Entrega atualizada':'Lançada para '+nomeDia(st.data).toLowerCase())}
      }finally{enviando=false;if(document.body.contains(btn)){btn.disabled=false;btn.textContent=ed?'Salvar':'Lançar no mural'}}
    });
  });
}
$('#fab').addEventListener('click',()=>abrirForm(null));


/* ---------- login e conexão ---------- */
function telaLogin(msg,outraConta){$('#app').hidden=true;$('#login').hidden=false;$('#loginMsg').textContent=msg;$('#gentrar').hidden=!!outraConta;$('#lsair').hidden=!outraConta}
$('#gentrar').addEventListener('click',()=>entrarComGoogle().catch(()=>toast('Não consegui entrar. Tente de novo.')));
$('#lsair').addEventListener('click',()=>auth.signOut());
$('#usair').addEventListener('click',()=>auth.signOut());
function desligar(){pararEntregas&&pararEntregas();pararNotas&&pararNotas();pararEntregas=pararNotas=null;notasDe=null;entregas=[];notasJ=[];loaded=false;me=null;fechar()}
auth.onAuthStateChanged(async u=>{
  desligar();
  if(!u){telaLogin('Entre com a sua conta Google para ver o mural.');return}
  let perfil=null;
  try{perfil=await carregarPerfil(u)}catch(e){telaLogin('Sem conexão com a internet. Tente de novo.',true);return}
  if(!perfil){telaLogin(`O e-mail ${u.email} ainda não tem acesso. Peça ao Bruno para cadastrar você no painel.`,true);return}
  me=perfil;P=perfil.perms;
  $('#login').hidden=true;$('#app').hidden=false;
  $('#unome').textContent='Olá, '+me.nome.split(' ')[0];$('#upainel').hidden=!me.admin;$('#fab').hidden=!P.lancar;
  try{const c=await db.collection('config').doc('equipe').get();VENDEDORES=c.exists?(c.data().vendedores||[]):[]}catch{}
  try{const mo=await db.collection('config').doc('motivos').get();const l=mo.exists&&mo.data().lista;MOTIVOS=Array.isArray(l)&&l.length?l:[...MOTIVOS_BASE]}catch{}
  render();
  // só as entregas recentes e futuras; o histórico fica no painel
  pararEntregas=db.collection('entregas').where('data','>=',addDays(hoje(),-45)).onSnapshot(snap=>{
    entregas=snap.docs.map(d=>({id:d.id,status:'pendente',...d.data()})).filter(e=>e.data);
    loaded=true;$('#sync').textContent='Ao vivo';$('#sync').className='sync on';
    if(!document.querySelector('.scrim'))render();else renderDays();
  },()=>{$('#sync').textContent='Conexão perdida — recarregue';$('#sync').className='sync off';});
  if(me.admin)limparFotosAntigas().catch(()=>{});
});
})();
</script>
