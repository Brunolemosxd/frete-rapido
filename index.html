<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1f5fae">
<title>Mural Frete Rápido</title>
<script>/* se der erro antes de abrir, mostra um aviso em vez de tela vazia */window.addEventListener('error',function(){if(document.getElementById('erroCarga'))return;var d=document.createElement('div');d.id='erroCarga';d.style.cssText='position:fixed;inset:0;display:grid;place-items:center;padding:24px;background:#10161c;color:#e7edf2;font:16px system-ui,sans-serif;text-align:center;z-index:99';d.innerHTML='<div><p style="margin:0 0 16px">A página não carregou direito.</p><button onclick="location.reload()" style="font:inherit;font-weight:600;padding:12px 20px;border-radius:12px;border:0;background:#5b9bec;color:#0b1520">Recarregar</button></div>';(document.body||document.documentElement).appendChild(d)});</script>
<script>/* tema escolhido no botão 🌓 (aplicado antes de desenhar, para não piscar) */try{const t=localStorage.getItem('freterapido_tema');if(t==='light'||t==='dark')document.documentElement.dataset.theme=t}catch{}</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<style>
/* Layout: faixa de dias no topo, cartões de entrega por turno, botão grande de nova entrega embaixo */
:root{
  --bg:#eef1f4; --surface:#ffffff; --fg:#17212b; --muted:#5d6b78; --line:#d5dce3;
  --accent:#1f5fae; --accent-fg:#ffffff;
  --pend:#b7791f; --pend-bg:#fdf3e1; --ok:#2f855a; --ok-bg:#e3f4ea; --bad:#c53030; --bad-bg:#fbe7e7;
  --shadow:0 1px 2px rgba(23,33,43,.08),0 4px 14px rgba(23,33,43,.06);
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#10161c; --surface:#18212a; --fg:#e7edf2; --muted:#97a6b3; --line:#2a3642;
  --accent:#5b9bec; --accent-fg:#0b1520;
  --pend:#f0b450; --pend-bg:#33270f; --ok:#5fcf8f; --ok-bg:#12301f; --bad:#f07171; --bad-bg:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10161c; --surface:#18212a; --fg:#e7edf2; --muted:#97a6b3; --line:#2a3642;
  --accent:#5b9bec; --accent-fg:#0b1520;
  --pend:#f0b450; --pend-bg:#33270f; --ok:#5fcf8f; --ok-bg:#12301f; --bad:#f07171; --bad-bg:#3a1717;
  --shadow:0 1px 2px rgba(0,0,0,.4); color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line)}
.top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:12px 4px}
h1{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.01em;margin:0;text-transform:uppercase}
h1 span{color:var(--accent)}
.sync{font-size:13px;color:var(--muted)}
.sync.on{font-size:17px;font-weight:700;color:var(--ok);display:inline-flex;align-items:center;gap:6px}
.sync.on::before{content:"";width:10px;height:10px;border-radius:99px;background:var(--ok);box-shadow:0 0 0 3px var(--ok-bg)}
.sync.off{font-weight:600;color:var(--bad)}
.days{display:flex;gap:8px;overflow-x:auto;padding-block:8px 12px;scrollbar-width:none}
.days::-webkit-scrollbar{display:none}
.day{flex:0 0 auto;min-width:62px;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:6px 8px 8px;text-align:center;display:grid;gap:1px}
.day .wd{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.day .dn{font-family:var(--display);font-size:24px;font-weight:700;line-height:1}
.day .ct{font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;min-height:15px}
.day.on{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.day.on .wd,.day.on .ct{color:var(--accent-fg);opacity:.9}
.day .ct b{color:var(--pend)} .day.on .ct b{color:inherit}
main{padding-block:14px 120px;display:grid;gap:18px;max-width:720px;margin:0 auto}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;gap:8px;flex-wrap:wrap}
.dayhead h2{font-family:var(--display);font-size:22px;margin:0;text-transform:capitalize}
.tally{display:flex;gap:6px;flex-wrap:wrap;font-size:13px}
.pill{border-radius:99px;padding:2px 9px;font-weight:600;font-size:12px;letter-spacing:.03em;text-transform:uppercase}
.p-pend{background:var(--pend-bg);color:var(--pend)} .p-ok{background:var(--ok-bg);color:var(--ok)} .p-bad{background:var(--bad-bg);color:var(--bad)}
section h3{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);margin:0 0 8px;font-weight:600}
section.late h3{color:var(--bad)}
section.feitas h3{color:var(--ok)}
section.feitas{border-top:1px solid var(--line);padding-top:14px}
.list{display:grid;gap:10px}
.card{position:relative;border-radius:14px;overflow:hidden;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.under{position:absolute;inset:0;display:flex;justify-content:space-between;align-items:center;padding:0 20px;font-weight:600;font-size:14px}
.under .l{color:var(--ok)} .under .r{color:var(--bad)}
.face{position:relative;background:var(--surface);box-shadow:var(--shadow);border-left:5px solid var(--pend);padding:12px 12px 12px 12px;display:flex;gap:12px;transition:transform .2s ease}
.card.prio .face{background:#c53030;color:#fff;border-left-color:#7a1414;box-shadow:0 4px 14px rgba(197,48,48,.35)}
.card.prio .face .who span,.card.prio .items,.card.prio .meta{color:#fff!important}
.card.prio .tag{border-color:rgba(255,255,255,.6);color:#fff}
.card.prio .thumb{border-color:rgba(255,255,255,.5)}
.pprio{background:#fff;color:#c53030;font-weight:700}
section.prio h3{color:var(--bad);font-size:14px}
.chip.prio[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.card.st-entregue .face{border-left-color:var(--ok)} .card.st-problema .face{border-left-color:var(--bad)}
.card.st-entregue .face .who{text-decoration:line-through;opacity:.65}
.card.mini .face{align-items:center;gap:8px;padding:9px 12px;flex-wrap:nowrap;border-left-color:var(--ok)}
.mok{flex:0 0 auto;width:22px;height:22px;border-radius:99px;background:var(--ok);color:#fff;display:grid;place-items:center;font-weight:800;font-size:13px}
.mnome{flex:1;min-width:0;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--muted)}
.mbai{font-weight:400}
.mcarr{flex:0 0 auto;font-size:12px;font-weight:700;color:var(--accent)}
.mabre{flex:0 0 auto;color:var(--muted);font-size:16px}
.thumb{flex:0 0 64px;height:64px;border-radius:10px;background:var(--bg) center/cover no-repeat;border:1px solid var(--line);display:grid;place-items:center;color:var(--muted);font-size:11px}
.info{min-width:0;flex:1;display:grid;gap:4px}
.who{font-weight:600;font-size:17px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.meta{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;color:var(--muted)}
.tag{border:1px solid var(--line);border-radius:6px;padding:1px 7px;color:var(--fg)}
.tag.dep{border-color:var(--accent);color:var(--accent)}
/* loja = azul fraquinho, depósito = marrom (iguais nos dois temas) */
.tag.loja,.pill.loja,.lc.loja{background:#cfe5fb;color:#164a7a;border-color:#a9cdf2}
.tag.dep,.pill.dep,.lc.dep{background:#7a4a21;color:#fff;border-color:#7a4a21}
.lc{border-radius:5px;padding:0 5px;font-weight:600;font-size:.92em;border:1px solid}
.cont.loja{background:#cfe5fb;border-color:#a9cdf2;color:#164a7a}
.cont.dep{background:#7a4a21;border-color:#7a4a21;color:#fff}
.cont.dep .step button{background:#fff;color:#7a4a21;border-color:#fff}
.cont.loja .step button{background:#fff;color:#164a7a;border-color:#a9cdf2}
.seg button[data-l="loja"][aria-pressed="true"]{background:#cfe5fb;color:#164a7a}
.seg button[data-l="deposito"][aria-pressed="true"]{background:#7a4a21;color:#fff}
/* entrega só depois de um horário: relógio roxo bem visível */
.hora{display:inline-flex;align-items:center;gap:6px;background:#6b3fd0;color:#fff;border-radius:8px;padding:3px 10px;
  font-family:var(--display);font-weight:700;font-size:18px;line-height:1.15;text-transform:uppercase;letter-spacing:0;white-space:nowrap}
.hora .rel{font-size:18px}
.card.prio .hora{background:#fff;color:#6b3fd0}
.card.prio .tag.loja{color:#164a7a;border-color:#a9cdf2}.card.prio .tag.dep{border-color:#7a4a21}
.card.hr .face{box-shadow:inset 0 0 0 2px #6b3fd0,var(--shadow)}
section.hr h3{color:#6b3fd0;font-size:14px}
:root[data-theme="dark"] section.hr h3{color:#b79cf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) section.hr h3{color:#b79cf5}}
/* frete na nota: faixa vermelha embaixo da foto */
.fnota{background:#c53030;color:#fff;border-radius:6px;padding:2px 3px;font-size:11px;font-weight:800;text-align:center;line-height:1.15;text-transform:uppercase;width:100%}
.card.prio .fnota{background:#fff;color:#c53030}
.chip[data-pag="nota"][aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.items{font-size:14px;color:var(--muted);overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.obs{font-size:13px;color:var(--bad)}
.end{font-size:14px;line-height:1.3;color:var(--fg);overflow-wrap:anywhere}
.end b{font-weight:600}
.end .bai2{font-weight:700;color:var(--accent)}
.card.prio .end .bai2{color:#fff;text-decoration:underline}
/* botões dentro do cartão (copiar, mapa): não abrem o detalhe nem arrastam o cartão */
.cbtns{display:flex;gap:6px;flex-wrap:wrap}
.cbtn{display:inline-flex;align-items:center;gap:4px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);border-radius:10px;padding:6px 10px;font-weight:600;font-size:14px;text-decoration:none;line-height:1.1}
.card.prio .cbtn{background:#fff;color:#7a1414;border-color:#fff}
.vbox{border-radius:12px;padding:8px 12px;display:grid;gap:3px;border:2px solid var(--line);background:var(--bg)}
.vtit{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;letter-spacing:.01em}
.vdet{font-size:15px;font-weight:600;color:var(--fg)}
.vaj{display:inline-block;background:#f4c430;color:#3d2e00;border-radius:6px;padding:0 6px;font-weight:800}
.v-cobrar{background:var(--pend-bg);border-color:var(--pend)} .v-cobrar .vtit{color:var(--pend)}
.v-pago{background:var(--ok-bg);border-color:var(--ok)} .v-pago .vtit{color:var(--ok)}
.v-nota{background:var(--bad-bg);border-color:var(--bad)} .v-nota .vtit{color:var(--bad)}
.v-vend{border-color:#6b3fd0} .v-vend .vtit{color:#6b3fd0;font-size:22px}
:root[data-theme="dark"] .v-vend .vtit{color:#b79cf5}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .v-vend .vtit{color:#b79cf5}}
.card.prio .vbox{background:#fff;border-color:#fff}.card.prio .vbox .vdet{color:#17212b}
.card.prio .v-cobrar .vtit{color:#b7791f}.card.prio .v-pago .vtit{color:#2f855a}.card.prio .v-nota .vtit{color:#c53030}.card.prio .v-vend .vtit{color:#6b3fd0}
/* blocos do cartão: tudo do cliente junto, tudo da nota junto */
.grp{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;display:grid;gap:6px}
.glbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.grp .who{white-space:normal}
.gfone{display:grid;grid-template-columns:1fr auto;align-items:center;gap:8px;font-size:15px}
.grp .cbtns{display:grid;grid-template-columns:1fr auto}
.grp .cbtns .cbtn,.gfone .cbtn{font-size:13px;padding:6px 8px;justify-content:center;white-space:nowrap}
.gsub{color:var(--muted);font-size:13px}
.gfone b{white-space:nowrap}
.gitens{display:grid;gap:4px}
.gitem{display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:15px;font-weight:600}
.card.prio .grp{background:rgba(255,255,255,.12);border-color:rgba(255,255,255,.45)}
.card.prio .glbl,.card.prio .gsub{color:#fff;opacity:.9}
/* formulário em blocos: nota, cliente, dia/turno, frete */
.fgrp{border:1.5px solid var(--line);border-top:5px solid var(--accent);border-radius:16px;padding:12px;display:grid;gap:16px;background:var(--surface);box-shadow:var(--shadow)}
.fglbl{font-family:var(--display);font-weight:700;font-size:21px;text-transform:uppercase;letter-spacing:.03em;margin-bottom:-4px}
.fg-nota{border-top-color:#7a4a21}.fg-cli{border-top-color:var(--accent)}.fg-ent{border-top-color:#6b3fd0}.fg-frete{border-top-color:var(--ok)}
.tfone{font-size:12px;font-weight:700;text-align:center;line-height:1.2;font-variant-numeric:tabular-nums;color:var(--fg)}
.card.prio .tfone{color:#fff}
.tcol .cbtn{padding:5px 6px;font-size:12px;width:100%;justify-content:center}
.card.prio .end{color:#fff}
/* botão de voltar sempre visível no alto do detalhe */
.voltar{position:sticky;top:-10px;z-index:2;justify-self:start;display:inline-flex;align-items:center;gap:6px;margin:-4px 0 -6px;
  background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:10px 16px;font-weight:700;font-size:16px;box-shadow:var(--shadow)}
.avuso{padding:10px 14px;font-weight:700;font-size:15px;text-align:center}
.avuso.medio{background:#f4c430;color:#3d2e00}
.avuso.alto{background:#c53030;color:#fff}

.face{flex-wrap:wrap}
/* faixa grande do problema no topo do cartão: precisa ser vista de longe */
.probfaixa{flex:1 1 100%;display:flex;gap:8px;align-items:center;background:#c53030;color:#fff;border-radius:10px;padding:8px 12px;
  font-family:var(--display);font-weight:700;font-size:22px;line-height:1.1;text-transform:uppercase;letter-spacing:.02em;overflow-wrap:anywhere}
.probfaixa .ic{font-size:24px;flex:0 0 auto}
.sheet .probfaixa{font-size:24px;padding:10px 14px}
textarea{resize:vertical;min-height:80px}
/* post-it: amarelo nos dois temas, como papel de verdade */
.postits{display:grid;gap:8px;margin-top:4px}
.postit{background:#fff3a6;color:#3d3500;border-radius:3px;padding:8px 10px;font-size:14px;line-height:1.35;box-shadow:0 2px 6px rgba(0,0,0,.14);transform:rotate(-.6deg);white-space:pre-wrap;overflow-wrap:anywhere}
.postit:nth-child(even){transform:rotate(.6deg)}
.postit .pm{font-size:11px;opacity:.7;margin-top:4px}
.postit.full{display:flex;gap:8px;align-items:flex-start;transform:none}
.postit.full .tx{flex:1;min-width:0}
.postit.full button{border:0;background:rgba(61,53,0,.12);color:#3d3500;border-radius:99px;width:28px;height:28px;flex:0 0 auto;font-size:16px;line-height:1}
textarea.postit-in{background:#fff3a6;color:#3d3500;border-color:#e6d36a}
.btn.post{background:#fff3a6;border-color:#e6d36a;color:#3d3500}
.empty{border:1.5px dashed var(--line);border-radius:14px;padding:28px 18px;text-align:center;color:var(--muted);display:grid;gap:6px}
.empty strong{color:var(--fg);font-size:17px}
.hint{font-size:13px;color:var(--muted);text-align:center}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:6;background:var(--accent);color:var(--accent-fg);border:0;border-radius:99px;padding:15px 26px;font-family:var(--display);font-size:20px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap;box-shadow:0 6px 20px rgba(31,95,174,.35)}
/* sheets */
.scrim{position:fixed;inset:0;background:rgba(10,16,22,.5);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:640px;max-height:92%;overflow-y:auto;border-radius:20px 20px 0 0;padding-block:10px calc(20px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:grid;gap:16px}
.grab{width:42px;height:5px;border-radius:9px;background:var(--line);margin:0 auto}
.sheet h2{font-family:var(--display);font-size:24px;margin:0;text-transform:uppercase}
.field{display:grid;gap:7px}
.field>label,.lbl{font-size:12px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 14px;font-weight:600;font-size:15px}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
input[type=text],input[type=date],input[type=time],input[type=tel],textarea{width:100%;font:inherit;font-size:16px;padding:11px 12px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg)}
.row{display:flex;gap:8px;align-items:center}
.row>input{flex:1;min-width:0}
.req{color:var(--bad)}
input.err{border-color:var(--bad)}
.chips.err .chip{border-color:var(--bad)}
.toggles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bai{position:relative}
.sugs{display:grid;border:1.5px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);max-height:280px;overflow-y:auto}
.sugs button{display:flex;justify-content:space-between;gap:10px;text-align:left;border:0;border-bottom:1px solid var(--line);background:none;padding:11px 12px;font-size:15px}
.sugs button:last-child{border-bottom:0}
.sugs button span{color:var(--muted);white-space:nowrap}
.fretebox{border:1.5px solid var(--line);border-radius:12px;padding:12px;background:var(--bg);display:grid;gap:10px}
.fretebox .base{display:flex;justify-content:space-between;align-items:baseline;gap:10px;flex-wrap:wrap}
.fretebox .base b{font-family:var(--display);font-size:28px}
.fretebox .tot{font-family:var(--display);font-size:24px;font-weight:700;color:var(--accent)}
.ajs{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.ajs .chip{padding:9px 0;text-align:center;font-size:15px}
.ajs .chip.neg[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.pags{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.pags .chip{text-align:left;font-size:14px;padding:10px 12px;line-height:1.25}
.toggles .chip{text-align:left;font-size:14px;padding:10px 12px;line-height:1.25}
.prods{display:flex;gap:6px;flex-wrap:wrap}
.prod{border:1.5px solid var(--line);background:var(--bg);border-radius:99px;padding:8px 12px;font-weight:600;font-size:14px}
.plist{display:grid;gap:8px}
.pitem{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;border:1px solid var(--line);border-radius:12px;padding:8px 8px 8px 12px;background:var(--bg)}
.pitem .linha{grid-column:1/-1;display:flex;gap:8px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.qty{display:flex;align-items:center;gap:8px}
.qty button{width:34px;height:34px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:20px;font-weight:700;line-height:1}
.qty b{font-family:var(--display);font-size:22px;min-width:22px;text-align:center;font-variant-numeric:tabular-nums}
.pitem .nm{flex:1;min-width:0;font-weight:600;overflow:hidden;text-overflow:ellipsis}
.seg{display:flex;flex:0 0 auto;border:1.5px solid var(--line);border-radius:10px;overflow:hidden}

.photo{border-radius:14px;overflow:hidden;border:1px solid var(--line);background:var(--bg)}

.photobtn{display:flex;gap:10px;align-items:center}
.photobtn.err .thumb{border:2px solid var(--bad)}
.photobtn.err #fbtn{border-color:var(--bad);color:var(--bad)}
.fextras{display:flex;gap:10px;flex-wrap:wrap}
.fextras:empty{display:none}
.fx{position:relative}
.fx .thumb{width:64px;height:64px}
.fx button{position:absolute;top:-6px;right:-6px;border:0;background:var(--bad);color:#fff;border-radius:99px;width:24px;height:24px;line-height:1;font-size:14px;box-shadow:0 0 0 2px var(--surface)}
.thumb{position:relative}
.tcol{flex:0 0 70px;display:grid;gap:4px;align-content:start;justify-items:center}
.tcol .thumb{width:64px}
.seta{font-size:34px;font-weight:900;line-height:.9}
.seta.s-norte{color:#2b6fd6}.seta.s-sul{color:#d63333}.seta.s-centro{color:#8a96a3}
.card.prio .seta{color:#fff;text-shadow:0 1px 2px rgba(0,0,0,.35)}

.card.prio .carr{color:#fff}
.thumb .mais{position:absolute;right:3px;bottom:3px;background:rgba(0,0,0,.7);color:#fff;border-radius:6px;padding:0 5px;font-size:11px;font-weight:700}
.crow{display:grid;grid-template-columns:1fr 1fr auto;gap:6px;align-items:center}

.notas2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.notas2.err .cont{border-color:var(--bad)}
.cont{border:1.5px solid var(--line);background:var(--bg);border-radius:12px;padding:8px 10px;display:grid;gap:6px;justify-items:center}
.cont>span{font-weight:600;font-size:14px}
.step{display:flex;align-items:center;gap:10px}
.step button{width:40px;height:40px;border-radius:99px;border:1.5px solid var(--line);background:var(--surface);font-size:22px;font-weight:700;line-height:1}
.step b{font-family:var(--display);font-size:26px;min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.photobtn .thumb{flex-basis:72px;height:72px}
.det{display:grid;gap:6px;font-size:15px}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;z-index:30;font-size:14px;max-width:calc(100% - 32px);text-align:center}
@media (prefers-reduced-motion:reduce){.face{transition:none}}
.usr{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:13px;color:var(--muted);padding-bottom:2px}
.usr a,.usr button{color:var(--accent);font-weight:600;background:none;border:0;padding:4px 0;font-size:13px;text-decoration:none}
.login{min-height:100vh;display:grid;place-items:center;padding:24px 16px}
.login .box{width:100%;max-width:380px;background:var(--surface);border-radius:20px;box-shadow:var(--shadow);padding:28px 20px;display:grid;gap:16px;text-align:center}
.login h1{font-size:34px}
.login p{margin:0;color:var(--muted)}
.gbtn{display:flex;align-items:center;justify-content:center;gap:10px;border:1.5px solid var(--line);background:#fff;color:#1f1f1f;border-radius:12px;padding:13px 16px;font-weight:600;font-size:16px}
.gbtn svg{width:20px;height:20px}
</style>
</head>

<script>
(function(){
const $=s=>document.querySelector(s);
const WD=['dom','seg','ter','qua','qui','sex','sáb'];
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
const TURNOS={manha:'Manhã',tarde:'Tarde',apos:'Depois das'};
const ST={pendente:['Pendente','p-pend'],entregue:['Entregue','p-ok'],problema:['Problema','p-bad']};
// quem carrega o caminhão (aparece no menu ao segurar o cartão)
const CARREGADORES=['Tiago','Bruno'];
// entregas marcadas antes da correção do nome mostram o nome certo
const carr=e=>e.carregadoPor==='Thiago'?'Tiago':(e.carregadoPor||'');
// direção pelo bairro (vale o que está na tabela de fretes agora)
function direcaoDe(e){if(!e.bairro)return '';const t=TABELA.find(x=>semAcento(x.nome)===semAcento(e.bairro));return (t&&t.dir)||direcaoPadrao(e.bairro)}
const ORDEM_DIR={norte:0,centro:1,sul:2,'':3};
const porDirecao=(a,b)=>ORDEM_DIR[direcaoDe(a)]-ORDEM_DIR[direcaoDe(b)];
function setaHTML(e){const d=direcaoDe(e);return d?`<span class="seta s-${d}" title="${DIRECOES[d].nome}" aria-label="${DIRECOES[d].nome}">${DIRECOES[d].seta}</span>`:''}
const MOTIVOS_BASE=typeof MOTIVOS_PADRAO!=='undefined'?MOTIVOS_PADRAO:['Cliente ausente','Endereço errado','Produto faltando','Produto avariado','Não coube no carro','Remarcar'];
let MOTIVOS=[...MOTIVOS_BASE];
let TABELA=FRETES_PADRAO.map(x=>({...x}));
let me=null,P={},VENDEDORES=[],pararEntregas=null,pararNotas=null,notasDe=null;
let notasJ=[],pastaAberta=false;
let entregas=[],loaded=false,dia=ds(new Date());
// entregues ficam minimizadas; as que a pessoa abriu ficam abertas até recarregar a página
const expandidas=new Set();

function ds(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function pd(s){const [y,m,d]=s.split('-').map(Number);return new Date(y,m-1,d)}
function addDays(s,n){const d=pd(s);d.setDate(d.getDate()+n);return ds(d)}
const hoje=()=>ds(new Date());
function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function nomeDia(s){const h=hoje();if(s===h)return 'Hoje';if(s===addDays(h,1))return 'Amanhã';if(s===addDays(h,-1))return 'Ontem';
  return pd(s).toLocaleDateString('pt-BR',{weekday:'long',day:'numeric',month:'short'})}
function toast(t){const el=$('#toast');el.textContent=t;el.hidden=false;clearTimeout(toast.t);toast.t=setTimeout(()=>el.hidden=true,t.length>60?4500:2600)}
function fotoSrc(e){return e.thumb||e.fotoData||''}
const podeEditar=e=>P.editarTodas||(P.lancar&&e.criadoPorUid===me.uid);
function turnoTxt(e){return e.turno==='apos'?'Depois das '+(e.hora||'—'):(TURNOS[e.turno]||'Qualquer turno')}
// entrega "Depois das HH:MM": relógio em destaque para ninguém sair antes da hora
const horaHTML=e=>e.turno==='apos'?`<div><span class="hora"><span class="rel" aria-hidden="true">🕒</span>Só depois das ${esc(e.hora||'—')}</span></div>`:'';
function ordemTurno(e){return {manha:0,tarde:1,apos:2}[e.turno]??3}
const PRODUTOS=['Geladeira','Freezer','Fogão','Cooktop','Forno elétrico','Micro-ondas','Coifa','Lava-louças','Máquina de lavar','Lava e seca','Tanquinho','Secadora','Ar-condicionado','TV','Colchão','Cama box','Sofá','Guarda-roupa','Cômoda','Armário de cozinha','Mesa e cadeiras','Rack / painel'];
const LOC={loja:'Loja',deposito:'Depósito'};
// entregas antigas guardavam itens como texto e um único local para tudo
function itensDe(e){return (e.itens||[]).map(i=>typeof i==='string'?{nome:i,local:e.local||'loja',qtd:1}:{nome:i.nome||'',local:i.local||null,qtd:Math.max(1,+i.qtd||1)})}
const qtdNome=i=>(i.qtd>1?i.qtd+'× ':'')+i.nome;
function locais(e){const its=itensDe(e),s=new Set(its.map(i=>i.local).filter(Boolean));if(!its.length)s.add(e.local==='deposito'?'deposito':'loja');
  return {txt:s.size>1?'Loja + Depósito':s.has('deposito')?'Depósito':'Loja',dep:s.has('deposito')}}
// quantas notas fiscais e onde estão; entregas antigas só tinham "mais de uma nota"
function notasTagHTML(e){const l=+e.notasLoja||0,d=+e.notasDeposito||0;
  if(l||d){const p=(n,t,c)=>n?`<span class="pill ${c}">📄 ${n} ${n===1?'nota':'notas'} ${t}</span>`:'';
    return (l+d>1?`<span class="pill p-bad">📎 ${l+d} notas</span>`:'')+p(l,'na loja','loja')+p(d,'no depósito','dep')}
  return e.variasNotas?'<span class="pill p-bad">📎 Mais de uma nota</span>':''}
function localTagHTML(e){const l=locais(e);return l.txt==='Loja + Depósito'?'<span class="tag loja">Loja</span><span class="tag dep">Depósito</span>':`<span class="tag ${l.dep?'dep':'loja'}">${l.txt}</span>`}
const locHTML=k=>k?`<span class="lc ${k==='deposito'?'dep':'loja'}">${LOC[k]}</span>`:'';
function soDig(v){return String(v||'').replace(/\D/g,'')}
function fmtFone(v){const d=soDig(v).slice(0,11);if(!d)return '';if(d.length<3)return '('+d;
  const a=d.slice(0,2),r=d.slice(2);if(r.length<=4)return `(${a}) ${r}`;const k=r.length>8?5:4;return `(${a}) ${r.slice(0,k)}-${r.slice(k)}`}
function foneOk(v){const n=soDig(v).length;return n===10||n===11}
function quando(t){return t?new Date(t).toLocaleString('pt-BR',{day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'}):''}
async function copiar(t,msg){
  let ok=false;
  try{await navigator.clipboard.writeText(t);ok=true}catch{}
  // alguns navegadores bloqueiam a área de transferência dentro de páginas incorporadas
  if(!ok){const ta=document.createElement('textarea');ta.value=t;ta.setAttribute('readonly','');ta.style.cssText='position:fixed;opacity:0';document.body.appendChild(ta);ta.select();
    try{ok=document.execCommand('copy')}catch{}ta.remove()}
  toast(ok?(msg||'Número copiado. É só colar no WhatsApp.'):'Não consegui copiar. Segure o dedo no texto para copiar.')}
function pegarFoto(cb){const f=$('#file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
  let b;try{b=await reduzir(file,1600,.8)}catch{toast('Não consegui ler essa foto.');return}cb(b)};f.click()}
const condTag=e=>e.condominio?'<span class="tag">🏢 Condomínio</span>':'';
// o mapa se perde com "ap 302", "bloco B" etc.; vai só rua, número e bairro
// só rua e número (é o que vai no "Copiar endereço": sem AP e sem bairro)
function enderecoRua(e){
  if(e.rua!==undefined)return e.rua+(e.numero?', '+e.numero:'');
  const base=String(e.endereco||'').replace(/[,\-–]?\s*\b(ap|apt|apto|apartamento|bl|bloco|torre|sala|cj|conjunto|casa|lote|lt|quadra|qd)\b\.?\s*(n[º°o.]?\s*)?([0-9]+|[a-z])\b.*$/i,'').trim()||e.endereco||'';
  if(/\d/.test(base))return base;
  // entregas antigas: o número pode ter ficado depois de "casa" ou no complemento; o número vai sempre junto
  // (número de quadra/lote não é número de casa)
  if(/\b(lote|lt|quadra|qd)\b\.?\s*\d/i.test(e.endereco||''))return base;
  const en=separarEndereco(e),rua=(en.rua||base).replace(/\s*\b(casa|n[º°o]?)\.?$/i,'').trim();return en.numero?rua+', '+en.numero:base}
// o mapa leva o bairro junto, para achar o lugar certo
function enderecoMapa(e){return enderecoRua(e)+(e.bairro?', '+e.bairro:'')}
function ajusteTxt(e){const a=ajusteDe(e);if(!a.por&&!a.valor)return '';return a.por+' '+(a.valor?(a.valor>0?'+':'−')+real(Math.abs(a.valor)):'pôs a mais')}
// pagamento aparece para todos: o entregador precisa saber se cobra ou não
function pagTagHTML(e,cartao){const p=pagamentoDe(e);
  if(p==='entrega')return e.frete?`<span class="pill p-pend">💰 Cobrar ${real(e.frete)}</span>`:'';
  if(p==='pix')return '<span class="pill p-ok">✓ Pago no Pix</span>';
  if(p==='junto')return '<span class="pill p-ok">💵 Dinheiro junto com a nota</span>';
  // no cartão o "frete na nota" já aparece embaixo da foto
  if(p==='nota')return cartao?'':'<span class="pill p-bad">🧾 Frete na nota</span>';
  if(p==='vendedor')return `<span class="pill p-frete">Por conta: ${esc(e.fretePor)}</span>`;
  return '<span class="pill p-ok">✓ Frete pago</span>'}
// caixa grande do valor no pé do cartão (entregas ainda não feitas).
// "Cobrar" aparece para todos; o resto do valor só para quem pode ver valores.
function valorHTML(e,V){
  const p=pagamentoDe(e),v=Number(e.frete)||0,aj=ajusteDe(e);
  // sem "ver valores": mostra como é pago, sem o valor (frete na nota já aparece embaixo da foto)
  if(!V&&!(p==='entrega'&&v)){const t={pix:['v-pago','✓ Pago no Pix'],junto:['v-pago','💵 Dinheiro junto com a nota'],pago:['v-pago','✓ Frete pago'],
    vendedor:['v-vend','Frete por conta do vendedor '+esc(e.fretePor||'')]}[p];return t?`<div class="vbox ${t[0]}"><div class="vtit">${t[1]}</div></div>`:''}
  if(!v&&p!=='vendedor')return '';
  const tit={entrega:`💰 Cobrar ${real(v)}`,pix:`✓ ${real(v)} pago no Pix`,junto:`💵 ${real(v)} junto com a nota`,nota:`🧾 ${real(v)} frete na nota`,
    vendedor:`${real(v)} por conta do vendedor ${esc(e.fretePor||'')}`,pago:`✓ ${real(v)} já pago`}[p]||real(v);
  const cls={entrega:'v-cobrar',pix:'v-pago',junto:'v-pago',nota:'v-nota',vendedor:'v-vend',pago:'v-pago'}[p]||'';
  let det='';
  if(V&&e.freteBase!==undefined){
    const base=e.freteConsultar?'Valor combinado':e.condominio&&e.freteTabela<=100?'Condomínio':'Tabela';
    if(aj.valor)det=`${base} ${real(e.freteBase)} <span class="vaj">${aj.valor>0?'+':'−'} ${real(Math.abs(aj.valor))} de ${esc(aj.por||'?')}</span>`;
    else if(e.freteConsultar||(e.condominio&&e.freteTabela<=100))det=`${base} ${real(e.freteBase)}`;
  }else if(V&&aj.por)det=`<span class="vaj">${esc(ajusteTxt(e))}</span>`;
  return `<div class="vbox ${cls}"><div class="vtit">${tit}</div>${det?`<div class="vdet">${det}</div>`:''}</div>`;
}
// hora em que a entrega foi lançada no mural (com o dia, se não foi hoje)
function lancadaTxt(e){if(!e.criadoEm)return '';const d=new Date(e.criadoEm),h=d.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  return ds(d)===hoje()?'às '+h:d.toLocaleDateString('pt-BR',{day:'2-digit',month:'2-digit'})+' às '+h}
function real(n){return Number(n||0).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}

/* ---------- dias ---------- */
function renderDays(){
  const h=hoje(),box=$('#days');let html='';
  for(let i=-2;i<=92;i++){
    const s=addDays(h,i),d=pd(s),list=entregas.filter(e=>e.data===s);

function render(){
  renderDays();ouvirNotas();
  const m=$('#main');
  const list=entregas.filter(e=>e.data===dia).sort((a,b)=>ordemTurno(a)-ordemTurno(b)||(a.hora||'').localeCompare(b.hora||'')||(a.criadoEm||0)-(b.criadoEm||0));
  const atras=dia===hoje()?entregas.filter(e=>e.data<dia&&e.status==='pendente').sort((a,b)=>a.data.localeCompare(b.data)):[];
  const c=k=>list.filter(e=>e.status===k).length;
  const totFrete=list.filter(e=>e.status!=='problema').reduce((s,e)=>s+(Number(e.frete)||0),0);
  let html=`<div class="dayhead"><h2>${esc(nomeDia(dia))}</h2><div class="tally">
    ${list.length?`<span class="pill p-pend">${c('pendente')} pendente${c('pendente')===1?'':'s'}</span><span class="pill p-ok">${c('entregue')} entregue${c('entregue')===1?'':'s'}</span>${c('problema')?`<span class="pill p-bad">${c('problema')} problema</span>`:''}${me&&me.admin&&totFrete?`<span class="pill p-frete">Fretes ${real(totFrete)}</span>`:''}`:''}
  </div></div>`;
  const nj=notasDoDia(dia).filter(n=>!n.arquivada).length;
  html+=`<button type="button" class="pasta" id="pasta"><span aria-hidden="true">📁</span>Produtos que vão com outras notas${nj?`<span class="n">${nj}</span>`:''}</button>`;

  if(!loaded){html+=`<div class="empty"><strong>Carregando o mural…</strong><span>As entregas agendadas aparecem aqui.</span></div>`}
  else if(!list.length){html+=`<div class="empty"><strong>Nenhuma entrega para ${esc(nomeDia(dia).toLowerCase())}</strong>${P.lancar?'<span>Toque em <b>+ Nova entrega</b> para lançar a nota.</span>':''}</div>`}
  else{
    // as já entregues saem dos turnos e vão para o fim da tela
    const abertas=list.filter(e=>e.status!=='entregue'),feitas=list.filter(e=>e.status==='entregue');
    const prio=abertas.filter(e=>e.prioridade).sort(porDirecao);
    if(prio.length)html+=`<section class="prio"><h3>⬆ Prioridade (${prio.length})</h3><div class="list">${prio.map(cardHTML).join('')}</div></section>`;
    for(const t of ['manha','tarde','apos','']){
      const g=abertas.filter(e=>!e.prioridade).filter(e=>(e.turno||'')===t||(t===''&&!TURNOS[e.turno])).sort(porDirecao);
      if(!g.length)continue;
      html+=`<section${t==='apos'?' class="hr"':''}><h3>${t==='apos'?'🕒 Só depois de um horário':t?TURNOS[t]:'Qualquer turno'}</h3><div class="list">${g.map(cardHTML).join('')}</div></section>`;
    }
    if(!abertas.length)html+=`<div class="empty"><strong>Tudo entregue! 🎉</strong></div>`;
    if(feitas.length)html+=`<section class="feitas"><h3>Entregues (${feitas.length})</h3><div class="list">${feitas.map(cardHTML).join('')}</div></section>`;
    html+=`<p class="hint">${P.marcar?'Arraste para a direita: entregue · para a esquerda: problema · segure para mais opções':'Toque numa entrega para ver tudo'}</p>`;
  }

function ouvirNotas(){
  if(!me||notasDe===dia)return;notasDe=dia;pararNotas&&pararNotas();notasJ=[];
  pararNotas=db.collection('notasjuntas').where('data','==',dia).onSnapshot(snap=>{

function notasDoDia(d){return notasJ.filter(n=>n.data===d).sort((a,b)=>(b.em||0)-(a.em||0))}
$('#main').addEventListener('click',e=>{if(e.target.closest('#pasta'))abrirPasta();const cp=e.target.closest('[data-copiar]');if(cp)copiar(cp.dataset.copiar,cp.dataset.msg);

const fotosDe=n=>Array.isArray(n.fotos)?n.fotos:(n.fotoData?[n.fotoData]:[]);
const LIMITE_DOC=900000; // um documento do Firebase guarda até 1 MB

    <div class="nfotos">${f.map((src,k)=>`<div class="nfoto"><img src="${esc(src)}" alt="Foto ${k+1}" data-ver="${esc(n.id)}" data-k="${k}">${P.pasta&&!arq?`<button type="button" class="x" data-fdel="${esc(n.id)}" data-k="${k}" aria-label="Tirar esta foto">×</button>`:''}</div>`).join('')}

    <div class="pm">${esc([quando(n.em),n.porNome,arq&&n.arquivadaPor?'arquivado por '+n.arquivadaPor:''].filter(Boolean).join(' · '))}</div>

  </div>`;

function listaPastaHTML(){
  const l=notasDoDia(dia),ativos=l.filter(n=>!n.arquivada),arqs=l.filter(n=>n.arquivada);
  let h=ativos.length?ativos.map(n=>itemPastaHTML(n,false)).join(''):`<div class="empty"><strong>Nada na pasta</strong><span>${P.pasta?'Quando um produto for junto com outra nota, toque em "Nova nota" e tire as fotos.':'As fotos das notas que vão juntas aparecem aqui.'}</span></div>`;

function salvarNota(id,dados,ok){return db.collection('notasjuntas').doc(id).update(dados).then(()=>ok&&toast(ok))
  .catch(e=>{e?.code==='permission-denied'?toast('Sem permissão. O Bruno precisa publicar as regras novas do Firebase.'):e?.code==='resource-exhausted'?toast('O mural está cheio por hoje. Fale com o Bruno.'):toast('Não consegui salvar. Tente de novo.')})}
function abrirPasta(){
  abrirSheet(`<h2>📁 Produtos que vão com outras notas</h2><p style="margin:0;color:var(--muted)">${esc(nomeDia(dia))}</p>
    ${P.pasta?'<button type="button" class="btn junto" data-a="foto">📷 Nova nota (tirar foto)</button>':''}
    <div class="plist2" id="plista">${listaPastaHTML()}</div>
    <button type="button" class="btn ghost" data-x>Fechar</button>`,
  s=>{pastaAberta=true;const redesenhar=()=>{const l=s.querySelector('#plista');if(l)l.innerHTML=listaPastaHTML()};
  s.addEventListener('click',ev=>{
    if(ev.target.closest('[data-x]'))fechar();
    if(ev.target.closest('[data-togarq]')){verArquivados=!verArquivados;redesenhar();return}
    if(ev.target.closest('[data-a="foto"]')){
      const d=dia;pegarFoto(async b=>{toast('Enviando a foto…');
        try{const id='n'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
          await db.collection('notasjuntas').doc(id).set({data:d,texto:'',fotos:[await fotoGrande(b)],arquivada:false,em:Date.now(),porUid:me.uid,porNome:me.nome});
          toast('Guardada. Se for mais de uma nota, toque em "+ foto".')}
        catch(e){e?.code==='permission-denied'?semPermissao():e?.code==='resource-exhausted'?toast('O mural está cheio por hoje. Fale com o Bruno.'):toast('Não consegui guardar a foto. Tente de novo.')}
      });return}
    const add=ev.target.closest('[data-fadd]');
    if(add){const n=notasJ.find(x=>x.id===add.dataset.fadd);if(!n)return;
      pegarFoto(async b=>{const nova=await fotoGrande(b),l=[...fotosDe(n),nova];
        if(l.join('').length>LIMITE_DOC){toast('Esse item já tem fotos demais. Toque em "Nova nota" para pôr as próximas.');return}
        toast('Enviando a foto…');n.fotos=l;redesenhar();salvarNota(n.id,{fotos:l,fotoData:null},'Foto juntada')});return}
    const fd=ev.target.closest('[data-fdel]');
    if(fd){const n=notasJ.find(x=>x.id===fd.dataset.fdel);if(!n)return;const l=fotosDe(n).filter((_,k)=>k!==+fd.dataset.k);
      if(!l.length){confirmarTirarFoto(n.id);return}n.fotos=l;redesenhar();salvarNota(n.id,{fotos:l,fotoData:null},'Foto tirada');return}
    const ver=ev.target.closest('[data-ver]');
    if(ver){const n=notasJ.find(x=>x.id===ver.dataset.ver);const src=n&&fotosDe(n)[+ver.dataset.k];if(!src)return;
      abrirSheet(`<div class="photo"><img src="${esc(src)}" alt="Foto da nota"></div><button type="button" class="btn" data-x>← Voltar para a pasta</button>`,
        s2=>s2.addEventListener('click',e2=>{if(e2.target.closest('[data-x]'))abrirPasta()}));return}
    const arq=ev.target.closest('[data-arq]');
    if(arq){const n=notasJ.find(x=>x.id===arq.dataset.arq);if(!n)return;n.arquivada=true;n.arquivadaPor=me.nome;redesenhar();render();
      salvarNota(n.id,{arquivada:true,arquivadaEm:Date.now(),arquivadaPor:me.nome},'Arquivado. Fica em "📦 Arquivados".');return}
    const des=ev.target.closest('[data-desarq]');
    if(des){const n=notasJ.find(x=>x.id===des.dataset.desarq);if(!n)return;n.arquivada=false;redesenhar();render();
      salvarNota(n.id,{arquivada:false,arquivadaEm:null,arquivadaPor:''},'Voltou para a pasta');return}
  });
  // o detalhe é salvo quando a pessoa sai do campo
  s.addEventListener('change',ev=>{const t=ev.target.closest('[data-txt]');if(!t)return;
    const n=notasJ.find(x=>x.id===t.dataset.txt),v=t.value.trim();if(!n||(n.texto||'')===v)return;n.texto=v;salvarNota(n.id,{texto:v},'Detalhe salvo')});
  s.addEventListener('keydown',ev=>{if(ev.key==='Enter'&&ev.target.closest('[data-txt]'))ev.target.blur()});
  });
}
function confirmarTirarFoto(id){

    <div class="actions two"><button type="button" class="btn ghost" data-x>Cancelar</button><button type="button" class="btn bad" data-ok>Tirar</button></div>`,

/* ---------- gestos ---------- */
let g=null;
$('#main').addEventListener('pointerdown',ev=>{
  const card=ev.target.closest('.card');if(!card||ev.target.closest('.cbtn'))return;
  g={card,id:card.dataset.id,x:ev.clientX,y:ev.clientY,dx:0,moved:false,long:false,face:card.querySelector('.face')};
  g.timer=setTimeout(()=>{if(g&&!g.moved){g.long=true;navigator.vibrate?.(30);abrirAcoes(g.id)}},480);
});
window.addEventListener('pointermove',ev=>{
  if(!g)return;const dx=ev.clientX-g.x,dy=ev.clientY-g.y;
  if(!g.moved&&Math.abs(dy)>12&&Math.abs(dy)>Math.abs(dx)){clearTimeout(g.timer);g=null;return}
  if(Math.abs(dx)>8){g.moved=true;clearTimeout(g.timer)}
  if(g.moved&&P.marcar&&!g.card.classList.contains('mini')){g.dx=dx;g.face.style.transition='none';g.face.style.transform=`translateX(${dx}px)`}
});
function endG(){
  if(!g)return;clearTimeout(g.timer);const {dx,face,id,moved,long,card}=g;g=null;
  face.style.transition='';face.style.transform='';
  if(long)return;
  if(card.classList.contains('mini')){if(!moved){expandidas.add(id);render()}return}
  if(moved){if(!P.marcar)return;if(dx>90)setStatus(id,'entregue');else if(dx<-90)abrirProblema(id)}
  else abrirDetalhe(id);
}
window.addEventListener('pointerup',endG);
window.addEventListener('pointercancel',()=>{if(g){clearTimeout(g.timer);g.face.style.transform='';g=null}});
$('#main').addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});

/* ---------- gravações ---------- */
function semPermissao(){toast('Você não tem permissão para isso. Fale com o Bruno.')}
async function salvar(id,dados,novo){
  try{const ref=db.collection('entregas').doc(id);novo?await ref.set(dados):await ref.update(dados);contarGravacao(1);return true}
  catch(e){if(e?.code==='permission-denied')semPermissao();
    else if(e?.code==='resource-exhausted')toast('O mural está cheio por hoje. Fale com o Bruno.');
    else toast('Não consegui salvar. Tente de novo.');return false}
}
async function setStatus(id,status,obs){
  const e=entregas.find(x=>x.id===id);if(!e)return;
  const d={status,atualizadoEm:Date.now()};if(obs!==undefined)d.obs=obs;
  Object.assign(e,d);render();
  if(await salvar(id,d)) toast(status==='entregue'?'Marcada como entregue':status==='problema'?'Marcada com problema':'Voltou para pendente');
}

function separarEndereco(e){
  if(e.rua!==undefined)return {rua:e.rua||'',numero:e.numero||'',semNumero:!!e.semNumero,complemento:e.complemento||''};
  let rua=String(e.endereco||''),numero='',comp=e.complemento||'';
  const m=/^(.*?)[\s,]*(?:n[º°o.]?\s*)?(\d+)\s*[,\-–]?\s*(.*)$/i.exec(rua);
  if(m){rua=m[1];numero=m[2];comp=[m[3].trim(),comp].filter(Boolean).join(', ')}
  // número que foi parar no complemento (ex.: "3252 - germinado")
  if(!numero){const c=/^(\d+)\s*[,\-–]?\s*(.*)$/.exec(comp);if(c){numero=c[1];comp=c[2]}}
  return {rua:rua.replace(/\d/g,'').replace(/[\s,\-–]+$/,'').replace(/\s+/g,' ').trim(),numero,semNumero:false,complemento:comp.trim()}
}

      q('#fbtn').textContent=fotoPrev?'📷 Trocar foto':'📷 Tirar foto';
      q('#fextras').innerHTML=extras.map((x,i)=>`<div class="fx"><div class="thumb" style="background-image:url('${esc(x.prev||x.src)}')"></div><button type="button" data-xdel="${i}" aria-label="Tirar esta foto">×</button></div>`).join('');
      q('#nloja').textContent=st.notasLoja;q('#ndep').textContent=st.notasDeposito;
    };sync();
    q('#cdia').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){st.data=b.dataset.v;sync()}});
    q('#fdata').addEventListener('change',e=>{if(e.target.value){st.data=e.target.value;sync()}});
    q('#cturno').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){st.turno=b.dataset.v;sync();if(st.turno==='apos')q('#fhora').focus()}});
    q('#fnotas').addEventListener('click',e=>{const b=e.target.closest('[data-n]');if(!b)return;const antes=st.notasLoja+st.notasDeposito;
      st[b.dataset.n]=Math.max(0,Math.min(20,st[b.dataset.n]+ +b.dataset.d));q('#fnotas').classList.remove('err');sync();
      if(antes===1&&st.notasLoja+st.notasDeposito===2)toast('Ponha a foto da outra nota na pasta 📁 do mural.')});
    q('#fprio').addEventListener('click',()=>{st.prioridade=!st.prioridade;sync()});
    // condomínio: tabela até R$ 100 vira R$ 100; acima de R$ 100 fica o valor da tabela
    const COND=100;
    function baseFrete(){if(!st.loc)return 0;if(st.loc.valor===null)return st.valorCombinado;return st.condominio&&st.loc.valor<=COND?COND:st.loc.valor}
    function totalFrete(){return st.loc?Math.max(0,baseFrete()+st.ajuste):0}
    // o valor da tabela não se digita; só o "a consultar" tem campo de valor
    function desenharFrete(){
      const b=q('#fbox');
      if(!st.loc){b.innerHTML='<span class="hint" style="text-align:left">Escolha o bairro na lista para aparecer o valor do frete.</span>';return}
      const cons=st.loc.valor===null;
      b.innerHTML=`<div class="base"><span>${esc(st.loc.nome)}</span>${cons?'<span class="hint">Valor a consultar</span>':`<b>🔒 ${real(baseFrete())}</b>`}</div>
        ${!cons&&st.condominio?`<span class="hint" style="text-align:left">${st.loc.valor<=COND?`Condomínio: R$ 100,00 (tabela ${real(st.loc.valor)})`:`Condomínio, mas a tabela é maior que R$ 100,00: fica o valor da tabela`}</span>`:''}
        ${cons?`<input type="text" id="fcons" inputmode="numeric" autocomplete="off" placeholder="Valor combinado R$ 0,00" value="${st.valorCombinado?real(st.valorCombinado):''}" aria-label="Valor combinado do frete">`:''}
        <span class="lbl">Mudar o valor (opcional)</span>
        <div class="ajs">${AJUSTES.map(v=>`<button type="button" class="chip${v<0?' neg':''}" data-aj="${v}" aria-pressed="${st.ajuste===v}">${v>0?'+':'−'}${Math.abs(v)}</button>`).join('')}</div>
        <div class="base"><span>Total do frete</span><span class="tot">${real(totalFrete())}</span></div>`;
    }
    q('#fbox').addEventListener('click',e=>{const b=e.target.closest('[data-aj]');if(!b)return;const v=+b.dataset.aj;st.ajuste=st.ajuste===v?0:v;if(!st.ajuste)st.ajustePor='';sync()});
    q('#fbox').addEventListener('input',e=>{if(e.target.id!=='fcons')return;const d=soDig(e.target.value).slice(0,7);st.valorCombinado=d?Number(d)/100:0;e.target.value=d?real(st.valorCombinado):'';
      e.target.classList.remove('err');const t=q('#fbox .tot');if(t)t.textContent=real(totalFrete())});
    q('#cajv').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){st.ajustePor=b.dataset.v;q('#cajv').classList.remove('err');sync()}});
    q('#fcond').addEventListener('click',()=>{st.condominio=!st.condominio;sync()});
    q('#fpags').addEventListener('click',e=>{const b=e.target.closest('[data-pag]');if(b){st.pag=b.dataset.pag;q('#fpags').classList.remove('err');sync()}});
    q('#cvend').addEventListener('click',e=>{const b=e.target.closest('.chip');if(b){st.fretePor=b.dataset.v;q('#cvend').classList.remove('err');sync()}});
    // sugestões de bairro enquanto digita (sem ligar para acento)
    const sugs=q('#fsugs');
    const mostrarSugs=()=>{const t=semAcento(q('#fbai').value);const l=TABELA.filter(x=>!t||semAcento(x.nome).includes(t)).slice(0,8);
      sugs.innerHTML=l.map(x=>`<button type="button" data-loc="${esc(x.nome)}">${esc(x.nome)}<span>${x.valor===null?'consultar':real(x.valor)}</span></button>`).join('')||'<span class="hint" style="padding:10px">Nenhum bairro com esse nome na tabela.</span>';
      sugs.hidden=false};
    q('#fbai').addEventListener('input',()=>{if(st.loc&&q('#fbai').value!==st.loc.nome){st.loc=null;st.valorCombinado=0;sync()}mostrarSugs()});
    q('#fbai').addEventListener('focus',mostrarSugs);
    q('#fbai').addEventListener('blur',()=>setTimeout(()=>sugs.hidden=true,200));
    sugs.addEventListener('pointerdown',e=>e.preventDefault());
    sugs.addEventListener('click',e=>{const b=e.target.closest('[data-loc]');if(!b)return;st.loc=TABELA.find(x=>x.nome===b.dataset.loc);st.valorCombinado=0;
      q('#fbai').value=st.loc.nome;q('#fbai').classList.remove('err');sugs.hidden=true;q('#fbai').blur();sync();
      if(st.loc.valor===null)setTimeout(()=>q('#fcons')?.focus(),50)});
    if(carregandoExtras)Promise.all(Array.from({length:qtdExtrasAntes},(_,i)=>db.collection('fotos').doc(ed.id+'__'+(i+1)).get().catch(()=>null)))
      .then(l=>{extras.unshift(...l.filter(f=>f&&f.exists&&f.data().foto).map(f=>({src:f.data().foto})));carregandoExtras=false;sync()});
    q('#fmaisfoto').addEventListener('click',()=>pegarFoto(b=>{extras.push({blob:b,prev:URL.createObjectURL(b)});sync()}));
    q('#fextras').addEventListener('click',e=>{const b=e.target.closest('[data-xdel]');if(b){extras.splice(+b.dataset.xdel,1);sync()}});
    const desenharContatos=()=>{q('#fconts').innerHTML=contatos.map((c,i)=>`<div class="crow"><input type="text" data-cn="${i}" value="${esc(c.nome)}" autocomplete="off" placeholder="Nome (opcional)" aria-label="Nome do outro contato">
      <input type="tel" data-cf="${i}" value="${esc(c.fone)}" inputmode="numeric" autocomplete="off" placeholder="(00) 00000-0000" aria-label="Telefone do outro contato"><button type="button" data-cdel="${i}" aria-label="Tirar este contato">×</button></div>`).join('')};
    desenharContatos();
    q('#fmaiscont').addEventListener('click',()=>{contatos.push({nome:'',fone:''});desenharContatos();q(`[data-cn="${contatos.length-1}"]`).focus()});
    q('#fconts').addEventListener('input',e=>{const n=e.target.dataset.cn,f=e.target.dataset.cf;
      if(n!==undefined)contatos[+n].nome=e.target.value;if(f!==undefined){e.target.value=fmtFone(e.target.value);contatos[+f].fone=e.target.value}});
    q('#fconts').addEventListener('click',e=>{const b=e.target.closest('[data-cdel]');if(b){contatos.splice(+b.dataset.cdel,1);desenharContatos()}});
    q('#fone').addEventListener('input',e=>{e.target.value=fmtFone(e.target.value)});
    q('#fend').addEventListener('input',e=>{if(/\d/.test(e.target.value)){e.target.value=e.target.value.replace(/\d/g,'');toast('Na rua vai só o nome. O número vai no campo "Número".')}});
    q('#fnum').addEventListener('input',e=>{e.target.value=soDig(e.target.value).slice(0,6)});
    q('#fsn').addEventListener('click',()=>{st.semNumero=!st.semNumero;q('#fnum').classList.remove('err');sync()});

    s.addEventListener('input',e=>e.target.classList?.remove('err'));
    q('#fprods').addEventListener('click',e=>{const b=e.target.closest('[data-p]');if(b){st.itens.push({nome:b.dataset.p,local:null,qtd:1});sync()}});
    const add=()=>{const v=q('#fitem').value.trim();if(v){st.itens.push({nome:v,local:null,qtd:1});q('#fitem').value='';sync()}q('#fitem').focus()};
    q('#fadd').addEventListener('click',add);
    q('#fitem').addEventListener('keydown',e=>{if(e.key==='Enter'){e.preventDefault();add()}});
    q('#fitens').addEventListener('click',e=>{
      const l=e.target.closest('[data-l]');if(l){st.itens[+l.dataset.i].local=l.dataset.l;sync();return}
      const qb=e.target.closest('[data-q]');if(qb){const it=st.itens[+qb.dataset.q];it.qtd=Math.max(1,Math.min(99,it.qtd+ +qb.dataset.d));sync();return}
      const d=e.target.closest('[data-del]');if(d){st.itens.splice(+d.dataset.del,1);sync()}});
    q('#fbtn').addEventListener('click',()=>{const f=$('#file');f.value='';f.onchange=async()=>{const file=f.files[0];if(!file)return;
      try{fotoBlob=await reduzir(file,1400,.75);q('#fotobox').classList.remove('err');if(fotoPrev&&fotoPrev.startsWith('blob:'))URL.revokeObjectURL(fotoPrev);fotoPrev=URL.createObjectURL(fotoBlob);sync()}catch{toast('Não consegui ler essa foto.')}};f.click()});
    q('#fcancel').addEventListener('click',fechar);
    q('#fsave').addEventListener('click',async()=>{
      if(enviando)return;
      st.clienteNome=q('#fcli').value.trim().replace(/\s+/g,' ');st.clienteSobrenome=q('#fsob').value.trim().replace(/\s+/g,' ');st.cliente=(st.clienteNome+' '+st.clienteSobrenome).trim();st.bairro=st.loc?st.loc.nome:q('#fbai').value.trim();st.complemento=q('#fcomp').value.trim().replace(/\s+/g,' ');st.rua=q('#fend').value.replace(/\d/g,'').replace(/\s+/g,' ').replace(/[\s,\-–]+$/,'').trim();st.numero=st.semNumero?'':soDig(q('#fnum').value);st.endereco=st.rua?st.rua+(st.semNumero?', S/N':st.numero?', '+st.numero:''):'';st.observacao=q('#fobs').value.trim();st.fone=q('#fone').value.trim();st.hora=q('#fhora').value;
      const pendItem=q('#fitem').value.trim();if(pendItem){st.itens.push({nome:pendItem,local:null,qtd:1});q('#fitem').value='';sync()}
      // entrega nova precisa da foto da nota (entregas antigas sem foto ainda podem ser editadas)
      if(!ed&&!fotoBlob){q('#fotobox').classList.add('err');q('#fotobox').scrollIntoView({block:'center'});toast('Tire a foto da nota antes de lançar.');return}
      const erros=[['#fcli',!st.clienteNome,'Coloque o nome do cliente como está na nota.'],['#fsob',!st.clienteSobrenome,'Coloque o sobrenome do cliente como está na nota.'],['#fone',!foneOk(st.fone),'Coloque o telefone com DDD. Ex.: (11) 98765-4321'],
        ['#fbai',!st.bairro,'Coloque o bairro.'],['#fend',!st.rua,'Coloque o nome da rua.'],['#fnum',!st.numero&&!st.semNumero,'Coloque o número da casa. Se não tiver, toque em "Sem número".']].filter(x=>x[1]);
      erros.forEach(([sel])=>q(sel).classList.add('err'));
      if(erros.length){toast(erros[0][2]);q(erros[0][0]).focus();return}
      // mesmo telefone no mesmo dia = entrega duplicada
      const dup=entregas.find(x=>x.id!==(ed?ed.id:'')&&x.data===st.data&&soDig(x.fone)===soDig(st.fone));
      if(dup){q('#fone').classList.add('err');q('#fone').focus();toast(`Já existe uma entrega para ${nomeDia(st.data).toLowerCase()} com esse telefone (${dup.cliente||'sem nome'}). Não lance de novo.`);return}
      const contOk=contatos.map(c=>({nome:c.nome.trim(),fone:c.fone.trim()})).filter(c=>c.nome||c.fone);
      const ruim=contatos.findIndex(c=>(c.nome.trim()||c.fone.trim())&&!foneOk(c.fone));
      if(ruim>=0){const el=q(`[data-cf="${ruim}"]`);el.classList.add('err');el.focus();toast('Confira o telefone do outro contato, com DDD.');return}
      if(carregandoExtras){toast('Espere as fotos carregarem.');return}
      if(!st.loc){q('#fbai').classList.add('err');q('#fbai').focus();toast('Escolha o bairro na lista. Se não estiver, fale com o Bruno.');return}
      if(st.loc.valor===null&&!(st.valorCombinado>0)){const c=q('#fcons');c.classList.add('err');c.focus();toast('Esse bairro é a consultar: coloque o valor combinado.');return}
      if(st.ajuste&&!st.ajustePor){q('#cajv').classList.add('err');q('#cajv').scrollIntoView({block:'center'});toast('Escolha qual vendedor mudou o valor do frete.');return}
      if(!PAGAMENTOS[st.pag]){q('#fpags').classList.add('err');q('#fpags').scrollIntoView({block:'center'});toast('Escolha como o frete é pago.');return}
      if(st.pag==='vendedor'&&!st.fretePor){q('#cvend').classList.add('err');q('#cvend').scrollIntoView({block:'center'});toast('Escolha qual vendedor paga o frete.');return}

      if(st.notasLoja+st.notasDeposito<1){q('#fnotas').classList.add('err');toast('Diga quantas notas tem na loja e no depósito.');q('#fnotas').scrollIntoView({block:'center'});return}
      if(st.itens.some(i=>!i.local)){errLocal=true;sync();toast('Diga se cada produto está na loja ou no depósito.');q('#fitens .pitem.err')?.scrollIntoView({block:'center'});return}
      enviando=true;const btn=q('#fsave');btn.disabled=true;btn.textContent='Salvando…';
      try{
        const id=ed?ed.id:'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
        let fotoNova=null;
        if(fotoBlob){st.thumb=await fotoMiniatura(fotoBlob);fotoNova=await fotoGrande(fotoBlob);st.fotoData=null}
        const fotosExtras=[];for(const x of extras)fotosExtras.push(x.blob?await fotoGrande(x.blob):x.src);
        const ls=new Set(st.itens.map(i=>i.local));
        const dados={cliente:st.cliente,clienteNome:st.clienteNome,clienteSobrenome:st.clienteSobrenome,fone:st.fone,bairro:st.bairro,endereco:st.endereco,rua:st.rua,numero:st.numero,semNumero:st.semNumero,complemento:st.complemento,observacao:st.observacao,freteBase:baseFrete(),freteTabela:st.loc.valor,condominio:st.condominio,freteConsultar:st.loc.valor===null,freteAjuste:st.ajuste,ajustePor:st.ajuste?st.ajustePor:'',frete:totalFrete(),
          pagamento:st.pag,fretePago:st.pag==='pix'||st.pag==='junto'||st.pag==='nota',fretePor:st.pag==='vendedor'?st.fretePor:'',aMaisPor:'',aMaisValor:0,prioridade:st.prioridade,notasLoja:st.notasLoja,notasDeposito:st.notasDeposito,variasNotas:st.notasLoja+st.notasDeposito>1,data:st.data,turno:st.turno,hora:st.turno==='apos'?st.hora:'',
          itens:st.itens.map(i=>({nome:i.nome,local:i.local,qtd:i.qtd})),local:ls.size>1?'ambos':ls.has('deposito')?'deposito':'loja',
          thumb:st.thumb||null,fotoData:st.fotoData||null,contatos:contOk,fotosExtras:fotosExtras.length,atualizadoEm:Date.now()};
        let ok;
        if(ed){ok=await salvar(id,dados)}
        else{dados.status='pendente';dados.obs='';dados.criadoEm=Date.now();dados.criadoPorUid=me.uid;dados.criadoPorNome=me.nome;ok=await salvar(id,dados,true)}
        // as que sobraram de antes ficam vazias (vendedor não pode apagar foto) e somem na limpeza
        if(ok)for(let i=0;i<Math.max(fotosExtras.length,qtdExtrasAntes);i++){
          try{await db.collection('fotos').doc(id+'__'+(i+1)).set({foto:fotosExtras[i]||'',em:Date.now()})}catch{toast('A entrega foi salva, mas uma das fotos não. Tente de novo.');break}}
        if(ok&&fotoNova){try{await db.collection('fotos').doc(id).set({foto:fotoNova,em:Date.now()})}catch{toast('A entrega foi salva, mas a foto grande não. Tente pôr a foto de novo.')}}
        if(ok){fechar();dia=st.data;render();toast(ed?'Entrega atualizada':'Lançada para '+nomeDia(st.data).toLowerCase())}
      }finally{enviando=false;if(document.body.contains(btn)){btn.disabled=false;btn.textContent=ed?'Salvar':'Lançar no mural'}}
    });
  });
}
$('#fab').addEventListener('click',()=>abrirForm(null));


/* ---------- login e conexão ---------- */
function telaLogin(msg,outraConta){$('#app').hidden=true;$('#login').hidden=false;$('#loginMsg').textContent=msg;$('#gentrar').hidden=!!outraConta;$('#lsair').hidden=!outraConta}
$('#gentrar').addEventListener('click',()=>entrarComGoogle().catch(()=>toast('Não consegui entrar. Tente de novo.')));
$('#lsair').addEventListener('click',()=>auth.signOut());
$('#usair').addEventListener('click',()=>auth.signOut());
let pararUso=null;
function desligar(){pararUso&&pararUso();pararUso=null;$('#avuso').hidden=true;pararEntregas&&pararEntregas();pararNotas&&pararNotas();pararEntregas=pararNotas=null;notasDe=null;entregas=[];notasJ=[];loaded=false;me=null;fechar()}
auth.onAuthStateChanged(async u=>{
  desligar();
  if(!u){telaLogin('Entre com a sua conta Google para ver o mural.');return}
  let perfil=null;
  try{perfil=await carregarPerfil(u)}catch(e){telaLogin('Sem conexão com a internet. Tente de novo.',true);return}
  if(!perfil){telaLogin(`O e-mail ${u.email} ainda não tem acesso. Peça ao Bruno para cadastrar você no painel.`,true);return}
  me=perfil;P=perfil.perms;
  $('#login').hidden=true;$('#app').hidden=false;
  $('#unome').textContent='Olá, '+me.nome.split(' ')[0];$('#upainel').hidden=!me.admin;$('#fab').hidden=!P.lancar;
  try{const c=await db.collection('config').doc('equipe').get();VENDEDORES=c.exists?(c.data().vendedores||[]):[]}catch{}
  try{const tf=await db.collection('config').doc('fretes').get();const l=tf.exists&&tf.data().lista;TABELA=Array.isArray(l)&&l.length?l:FRETES_PADRAO.map(x=>({...x}))}catch{}
  try{const mo=await db.collection('config').doc('motivos').get();const l=mo.exists&&mo.data().lista;MOTIVOS=Array.isArray(l)&&l.length?l:[...MOTIVOS_BASE]}catch{}
  render();
  // só as entregas recentes e futuras; o histórico fica no painel
  pararEntregas=db.collection('entregas').where('data','>=',addDays(hoje(),-45)).onSnapshot(snap=>{
    contarSnap(snap);entregas=snap.docs.map(d=>({id:d.id,status:'pendente',...d.data()})).filter(e=>e.data);
    loaded=true;$('#sync').textContent='Ao vivo';$('#sync').className='sync on';
    if(!document.querySelector('.scrim'))render();else renderDays();
  },()=>{$('#sync').textContent='Conexão perdida — recarregue';$('#sync').className='sync off';});
  if(me.admin){limparFotosAntigas().catch(()=>{});
    pararUso=ouvirUso(u=>{const t=textoUso(u),el=$('#avuso');el.hidden=t.nivel==='ok';el.className='avuso '+t.nivel;
      el.textContent=t.nivel==='alto'?`⚠ Quase no limite grátis de hoje (${t.p}%). Se passar, o mural para até de madrugada.`:`Atenção: o mural já usou ${t.p}% do limite grátis de hoje.`})}
});
})();
</script>
